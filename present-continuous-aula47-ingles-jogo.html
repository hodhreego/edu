<script>

/* ===== AJUSTES FÁCEIS (segundos) ===== */

var RANK={intervalo:5,codigo:'4747',maxLinhas:10}; /* ranking ao vivo: consulta a cada 5 s */
var $=function(i){return document.getElementById(i)},stage=$('stage');
var OFFLINE=false,PIC={"jump": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g fill=\"none\" stroke=\"#111\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"50\" cy=\"20\" r=\"8\"/><path d=\"M50 28v30M50 36 34 48M50 36l16 12M50 58 40 80M50 58l10 22\"/><path d=\"M18 42c-8 24 2 44 32 44s40-20 32-44\"/><\/g><\/svg>", "sleep": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g fill=\"none\" stroke=\"#111\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 60h76v18H12zM12 78h76M18 78v8M82 78v8\"/><path d=\"M20 60V48h22v12\"/><circle cx=\"50\" cy=\"48\" r=\"7\"/><path d=\"M60 60h24v12H60z\"/><\/g><g fill=\"#111\" font-family=\"Arial\" font-weight=\"700\"><text x=\"66\" y=\"42\" font-size=\"14\">Z<\/text><text x=\"76\" y=\"34\" font-size=\"11\">z<\/text><\/g><\/svg>", "cook": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g fill=\"none\" stroke=\"#111\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 48h56v23a12 12 0 0 1-12 12H34a12 12 0 0 1-12-12z\"/><path d=\"M16 48h68M38 48v-8h24v8\"/><path d=\"M38 28c-6-6 6-10 0-16M50 28c-6-6 6-10 0-16M62 28c-6-6 6-10 0-16\"/><\/g><\/svg>", "run": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g fill=\"none\" stroke=\"#111\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"60\" cy=\"20\" r=\"7\"/><path d=\"M56 28 42 48l14 9\"/><path d=\"M42 48 26 40M56 28l14 9M56 57 44 78M56 57l16 14\"/><\/g><\/svg>", "read": "<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g fill=\"none\" stroke=\"#111\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"50\" cy=\"20\" r=\"8\"/><path d=\"M50 28v30M50 58 40 82M50 58l10 24M50 38 38 52M50 38l12 14\"/><path d=\"M30 52l16 6 16-6V40l-16 6-16-6z\"/><\/g><\/svg>", "watch": "<sv ool.<\/p>"}, {"k": "th", "t": "TO BE: negativa e pergunta", "h": "<p class=\"pt\"><b>Negativa:<\/b> coloque <b>not<\/b> depois de am / is / are.<\/p><p class=\"ex\">I <b>am not<\/b> late. &nbsp; He <b>is not<\/b> my teacher. &nbsp; We <b>are not<\/b> in the gym.<\/p><p class=\"pt\"><b>Pergunta:<\/b> o verbo vem antes da pessoa.<\/p><p class=\"ex\"><b>Am<\/b> I? &nbsp; <b>Is<\/b> she your mother? &nbsp; <b>Are<\/b> they in the gym?<\/p><p class=\"pt\"><b>Resposta curta:<\/b><\/p><p class=\"ex\">Yes, I <b>am<\/b>. / No, she <b>is not<\/b>. / Yes, they <b>are<\/b>.<\/p>"}, {"k": "th", "t": "Present continuous: a frase", "h": "<p class=\"pt\"><b>Fórmula:<\/b> sujeito + <b>am / is / are<\/b> + verbo com <b>-ing<\/b><\/p><table class=\"tb\"><tr><th>Pessoa<\/th><th>Afirmativa<\/th><th>Negativa<\/th><th>Pergunta<\/th><\/tr><tr><td>I<\/td><td>I am studying.<\/td><td>I am not studying.<\/td><td>Am I studying?<\/td><\/tr><tr><td>He / She / It<\/td><td>She is running.<\/td><td>She is not running.<\/td><td>Is she running?<\/td><\/tr><tr><td>You / We / They<\/td><td>They are playing.<\/td><td>They are not playing.<\/td><td>Are they playing?<\/td><\/tr><\/table>"}, {"k": "th", "t": "Palavras-sinal", "h": "<p class=\"pt\">Use o present continuous com estas palavras:<\/p><p class=\"big\">now &nbsp;·&nbsp; right now &nbsp;·&nbsp; at the moment &nbsp;·&nbsp; look! &nbsp;·&nbsp; listen!<\/p><p class=\"ex\">Look! The baby <b>is sleeping<\/b>.<\/p>"}, {"k": "th", "t": "Olhe e escolha", "h": "<p class=\"pt\">Agora vamos olhar figuras. Veja a ação e escolha a frase certa.<\/p><p class=\"ex\">She <b>is jumping<\/b> rope.<\/p>"}, {"k": "th", "t": "Ortografia: verbos curtos", "h": "<p class=\"pt\">Verbos curtos: apenas <b>-ing<\/b>.<\/p><p class=\"ex\">play &rarr; <b>playing<\/b> &nbsp;·&nbsp; read &rarr; <b>reading<\/b> &nbsp;·&nbsp; talk &rarr; <b>talking<\/b><\/p>"}, {"k": "th", "t": "Ortografia: verbos com e", "h": "<p class=\"pt\">Verbos terminados em <b>e<\/b>: tire o e.<\/p><p class=\"
