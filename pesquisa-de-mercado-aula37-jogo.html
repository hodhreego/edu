<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesquisa de Mercado — Aula 37</title>
<style>

.jh{text-align:center;border-bottom:3px solid #111;margin-bottom:8px}.jh span{display:block;font:900 clamp(20px,3.4vw,30px) Georgia,serif;letter-spacing:1px}.jh small{display:block;font:700 .75em Georgia,serif;border-top:1px solid #111;padding:2px}
.jc{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}

.hc.s polygon{fill:#ffd24d}#hx{touch-action:none}.hw li.f,.jd li.f{border-left:10px solid var(--mk,#888);padding-left:6px}
.hw{list-style:none;margin:0;padding:0;font-weight:800;columns:2;flex:1;min-width:180px}.hw li{margin:4px 0}.hw li.f{text-decoration:line-through;color:#888}

.slide table{border-collapse:collapse;width:100%;font-size:.95em}.slide th,.slide td{border:2px solid #9fb0e8;padding:5px 8px;text-align:left}.slide th{background:#e8eefc}
.slide .dica{background:#fff8dc}
.tab{border-collapse:collapse;margin:8px 0;background:#fff}.tab th,.tab td{border:2px solid #9fb0e8;padding:6px 12px;text-align:left}.tab th{background:#e8eefc}.tab input.n{max-width:6em;margin:0}
.slide:fullscreen{overflow:auto;font-size:2.2vh}
</style></head><body>

<script>

 a:{em:'🍔',nome:'Delivery de lanche artesanal',cor:'#e8590c',neg:'delivery de lanche artesanal (hambúrguer, salgados ou doces vendidos por aplicativo ou WhatsApp)',ex:['Com que frequência você pede lanche por aplicativo?','Quanto você paga em média?','Que sabores você gostaria de encontrar?','O que pesa mais: preço, tempo de entrega ou sabor?'],sim:14,per:'por mês, 2 pedidos de R$ 18,00',rec:14*2*18,preco:'preço de um lanche',tb:[['Hambúrguer artesanal',48],['Salgados',36],['Doces e sobremesas',24],['Outro',12]],kw:'hamburguer',tbq:'delivery',
  jn:[['ENTREGA','Levar o pedido até a casa do cliente'],['SABOR','O que o cliente sente ao comer'],['COMBO','Lanche + bebida por um preço só'],['MOTOBOY','Quem faz a entrega de moto'],['PEDIDO','O que o cliente faz pelo aplicativo'],['RECEITA','Modo de preparo do lanche'],['CARDAPIO','Lista de lanches e preços'],['EMBALAGEM','Mantém o lanche quente e protegido']]},
 b:{em:'✂️',nome:'Salão ou barbearia',cor:'#7c3aed',neg:'salão ou barbearia (corte, barba, unhas, cabelo)',ex:['Com que frequência você corta o cabelo ou faz as unhas?','Quanto você paga?','Prefere hora marcada ou ordem de chegada?','O que faria você trocar de salão?'],sim:12,per:'por mês, 2 atendimentos de R$ 35,00',rec:12*2*35,preco:'preço do corte',tb:[['Corte de cabelo',48],['Unhas',36],['Barba',24],['Outro',12]],kw:'corte',tbq:'salão',
  jn:[['CORTE','Serviço mais pedido na barbearia'],['BARBA','Fica no rosto do cliente e precisa de aparo'],['UNHAS','Cuidadas pela manicure'],['ESCOVA','Alisa e dá forma ao cabelo'],['AGENDA','Onde ficam os horários marcados'],['TESOURA','Instrumento para cortar o cabelo'],['COLORACAO','Mudar a cor do cabelo'],['HIDRATACAO','Tratamento que devolve a maciez']]},
 c:{em:'👟',nome:'Loja de tênis personalizados',cor:'#0d9488',neg:'loja de tênis personalizados (cores, desenhos e nomes feitos sob encomenda)',ex:['Quantos pares de tênis você compra por ano?','Quanto pagaria por um personalizado?','Que estilo você prefere?','Onde você descobre novas marcas?'],sim:9,per:'1 par de R$ 250,00',rec:9*250,preco:'preço do tênis',tb:[['Tênis esportivo',48],['Tênis casual',36],['Tênis colorido personalizado',24],['Outro',12]],kw:'esportivo',tbq:'loja',
  jn:[['TENIS','O produto que você vende'],['SOLADO','Parte de baixo do calçado'],['CORES','Escolhidas pelo cliente na encomenda'],['ESTILO','Jeito próprio de se vestir'],['DESENHO','Arte pintada no tênis'],['COLECAO','Linha de modelos lançados juntos'],['TAMANHO','Número que o cliente calça'],['CADARCO','Cordão que amarra o tênis']]}
};
var HIVE=['PESQUISA','PUBLICO','AMOSTRA','CLIENTE','PRECO','DEMANDA','LUCRO','NICHO'];
var stage=document.getElementById('stage'),pts=document.getElementById('pts'),tema=null,score=0,R={},GOT={};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9,.]/g,'')}
function setPts(){pts.textContent=score+' pontos'}
function award(key,n){if(GOT[tema+key])return false;GOT[tema+key]=1;score+=n;setPts();return true}
function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedOf(s){var h=7;for(var i=0;i<s.length;i++)h=Math.imul(h,31)+s.charCodeAt(i)|0;return h}
function shuf(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- telas ---------- */
function bar(extra){var t=T[tema];return '<div class="bar" style="--c:'+t.cor+'"><button class="btn alt" id="bTema">🔄 Trocar negócio</button><button class="btn alt" id="bHub">🏠 Atividades</button>'+(extra||'')+'</div>'}
function wireBar(){var a=stage.querySelector('#bTema'),b=stage.querySelector('#bHub');if(a)a.onclick=menu;if(b)b.onclick=hub}
function menu(){tema=null;stage.innerHTML='<h2 id="pergunta">Escolha o negócio que você quer pesquisar</h2><p>Você pode trocar de negócio a qualquer momento. Seus pontos e respostas ficam guardados.</p><div class="temas">'+Object.keys(T).map(function(k){var t=T[k];return '<button class="tema" data-k="'+k+'" style="--c:'+t.cor+'"><span class="em">'+t.em+'</span>'+t.nome+'</button>'}).join('')+'</div><p style="text-align:center"><button class="btn alt" id="aulaB">📊 Ver a aula em slides</button></p>';
 [].forEach.call(stage.querySelectorAll('.tema'),function(b){b.onclick=function(){tema=b.dataset.k;R[tema]=R[tema]||{};hub()}});stage.querySelector('#aulaB').onclick=function(){slides(menu)};window.scrollTo(0,0)}
var ACTS=[['aula','📊','Aula em slides','Leia e edite as anotações'],['mc','🔘','Escolha','Marque a resposta certa'],['tp','⌨️','Digite','Escreva a resposta'],['dg','🧲','Arraste e solte','Complete as frases'],['bx','🔠','Quadrinhos','Uma letra em cada quadrinho'],['hv','🐝','Mini colmeia','Caça-palavras com 8 palavras'],['tb','📋','Analise a tabela','Responda com os dados'],['jn','📰','Caça-palavras do jornal','8 palavras com dicas'],['ds','✍️','Pesquisa escrita','Monte a sua pesquisa']];
function hub(){var t=T[tema];stage.innerHTML=bar()+'<h2 id="pergunta" style="margin-top:12px">'+t.em+' '+t.nome+' — escolha uma atividade</h2><div class="temas h">'+ACTS.map(function(a){var ok=GOT[tema+'done_'+a[0]];return '<button class="tema'+(ok?' okk':'')+'" data-a="'+a[0]+'" style="--c:'+t.cor+'"><span class="em">'+a[1]+'</span>'+a[2]+(ok?' ✔':'')+'<small>'+a[3]+'</small></button>'}).join('')+'</div>';wireBar();
 [].forEach.call(stage.querySelectorAll('.tema'),function(b){b.onclick=function(){run(b.dataset.a)}});window.scrollTo(0,0)}
function run(a){({aula:function(){slides(hub)},mc:actMc,tp:actTp,dg:actDg,bx:actBx,hv:actHv,jn:actJn,tb:actTb,ds:actDs})[a]();window.scrollTo(0,0)}
function fimAct(a){if(GOT[tema+'done_'+a])return;GOT[tema+'done_'+a]=1;score+=5;setPts()}

/* ---------- slides da aula (editáveis) ---------- */
var SL=[
 '<h2>Pesquisa de mercado</h2><p><b>Educação Financeira · 3ª série EM · Aula 37</b></p><p>Entender antes de vender.</p><p><b>Objetivo:</b> reconhecer os fundamentos do empreendedorismo, analisando o perfil empreendedor, as etapas para empreender, as oportunidades de negócio e ferramentas como pesquisas de mercado e inovação.</p><p>📋🔍 Antes de abrir um negócio, pergunte: quem é meu público? O que ele precisa? Quanto está disposto a pagar? Quem são meus concorrentes? A pesquisa de mercado transforma suposições em informação.</p>',
 '<h2>1. O que é pesquisa de mercado?</h2><p>É o processo de coletar e analisar informações sobre clientes, concorrentes e o ambiente de um negócio. Ela reduz riscos e ajuda a tomar decisões com mais segurança.</p><table><tr><th>Tipo</th><th>O que é</th><th>Exemplo</th></tr><tr><td>Primária</td><td>dados coletados por você</td><td>questionário, entrevista, observação</td></tr><tr><td>Secundária</td><td>dados já publicados</td><td>IBGE, Sebrae, relatórios, notícias</td></tr><tr><td>Quantitativa</td><td>números e percentuais</td><td>“70% dos clientes preferem…”</td></tr><tr><td>Qualitativa</td><td>motivos e opiniões</td><td>“Por que você escolhe esse produto?”</td></tr></table>',
 '<h2>2. Etapas da pesquisa</h2><ol><li>Defina o problema: o que você quer descobrir?</li><li>Escolha o público e a amostra.</li><li>Prepare o instrumento (questionário ou roteiro).</li><li>Colete os dados.</li><li>Organize e interprete os resultados.</li><li>Tome uma decisão com base nos dados.</li></ol><p class="dica"><b>Boa pergunta:</b> clara, curta e sem induzir a resposta. Evite “Você não acha que nosso produto é ótimo?”. Prefira “Como você avalia o produto?”.</p>'];
var slideI=0,editing=false;
function slides(back){var h='<div class="bar"><button class="btn alt" id="sBack">◀ Voltar</button><button class="btn alt" id="sEdit">✏️ Editar anotações</button><button class="btn alt" id="sFull">⛶ Tela cheia</button></div><div class="slide" id="slide" contenteditable="false"></div><div class="nav"><button class="btn alt" id="sPrev">◀ Slide anterior</button><span id="sCnt"></span><button class="btn" id="sNext">Próximo slide ▶</button></div><p class="mut">Dica: ative "Editar anotações" para alterar o texto do slide. As mudanças ficam neste aparelho.</p>';
 stage.innerHTML=h;var sl=stage.querySelector('#slide');
 function load(){var sv=null;try{sv=localStorage.getItem('pm37_slide'+slideI)}catch(e){}sl.innerHTML=sv||SL[slideI];stage.querySelector('#sCnt').textContent=(slideI+1)+' / '+SL.length;stage.querySelector('#sPrev').disabled=!slideI;stage.querySelector('#sNext').textContent=slideI===SL.length-1?'Terminar ✔':'Próximo slide ▶'}
 function save(){try{localStorage.setItem('pm37_slide'+slideI,sl.innerHTML)}catch(e){}}
 sl.addEventListener('input',save);sl.addEventListener('keydown',function(e){e.stopPropagation()});

 stage.querySelector('#sBack').onclick=function(){save();back()};

 load()}

/* ---------- 1) escolha ---------- */
function actMc(){var t=T[tema],q=[
 ['O que é pesquisa de mercado?','Descobrir o que os clientes querem antes de vender',['Fazer propaganda na televisão','Contar o dinheiro do caixa']],
 ['Quem é o público-alvo de um negócio?','As pessoas que mais provavelmente vão comprar',['Todas as pessoas do mundo','Somente os amigos do dono']],
 ['Qual é uma boa pergunta para a pesquisa?',t.ex[1],['Você não acha que o nosso produto é ótimo?','Qual é a cor do carro do seu pai?']],
 ['Você entrevistou 20 pessoas e '+t.sim+' comprariam. Qual a porcentagem?',(t.sim*5)+'%',[(t.sim*5+10)+'%',(100-t.sim*5-5)+'%']]];
 var r=rng(seedOf(tema+'mc')),h=bar()+'<h2 id="pergunta">🔘 Escolha a resposta certa</h2>';
 q.forEach(function(x,i){var o=shuf([x[1]].concat(x[2]),r);h+='<div class="card" style="--c:'+t.cor+'"><p><b>'+(i+1)+'.</b> '+esc(x[0])+'</p>'+o.map(function(v){return '<button class="opt" data-i="'+i+'" data-ok="'+(v===x[1]?1:0)+'">'+esc(v)+'</button>'}).join('')+'<div class="fb"></div></div>'});
 stage.innerHTML=h;wireBar();var n=0,need=q.length;
 [].forEach.call(stage.querySelectorAll('.opt'),function(b){b.onclick=function(){var c=b.parentNode;if(c.dataset.done)return;if(b.dataset.ok==='1'){c.dataset.done=1;b.classList.add('ok');c.querySelector('.fb').textContent='✔ Certo!';c.querySelector('.fb').className='fb ok';[].forEach.call(c.querySelectorAll('.opt'),function(x){x.disabled=true});if(award('mc'+b.dataset.i,5)){}if(++n===need)fimAct('mc')}else{b.classList.add('no');b.disabled=true;c.querySelector('.fb').textContent='Tente de novo';c.querySelector('.fb').className='fb no'}}})}

/* ---------- 2) digite (quadrinhos individuais) ---------- */
function boxHtml(i,ans){return '<div class="bxs" data-i="'+i+'" data-a="'+esc(ans)+'">'+ans.split('').map(function(_,k){return '<input maxlength="1" data-k="'+k+'" autocomplete="off" inputmode="'+(/^\d+$/.test(ans)?'numeric':'text')+'">'}).join('')+'</div>'}
function wireBoxes(root,onOk){[].forEach.call(root.querySelectorAll('.bxs'),function(g){var i=g.dataset.i,ans=g.dataset.a,num=/^\d+$/.test(ans),ins=g.querySelectorAll('input'),fb=g.parentNode.querySelector('.fb');
 [].forEach.call(ins,function(inp,k){inp.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Backspace'&&!inp.value&&k>0){ins[k-1].focus();ins[k-1].value=''}else if(e.key==='ArrowLeft'&&k>0)ins[k-1].focus();else if(e.key==='ArrowRight'&&k<ins.length-1)ins[k+1].focus()});
  inp.addEventListener('input',function(){inp.value=inp.value.toUpperCase().replace(num?/[^0-9]/g:/[^A-Z]/g,'');if(inp.value&&k<ins.length-1)ins[k+1].focus();var w=[].map.call(ins,function(x){return x.value}).join('');if(w.length===ans.length){if(w===ans){fb.textContent='✔ Certo!';fb.className='fb ok';[].forEach.call(ins,function(x){x.disabled=true;x.classList.add('ok')});onOk(i)}else{fb.textContent='Confira as letras';fb.className='fb no'}}else{fb.textContent='';}})})})}
function actTp(){var t=T[tema],q=[
 ['Pesquisa de mercado serve para conhecer o ______ (quem compra o produto).','CLIENTE'],
 ['Quem já vende algo parecido com o seu negócio é o seu ______.','CONCORRENTE'],
 ['Qual a porcentagem de '+t.sim+' em 20? (só o número)',String(t.sim*5)],
 [t.sim+' pessoas gastariam '+t.per+'. Quanto você faturaria no total? (só o número, em reais)',String(t.rec)]];
 var h=bar()+'<h2 id="pergunta">⌨️ Digite a resposta, uma letra (ou número) em cada quadrinho</h2>';
 q.forEach(function(x,i){h+='<div class="card" style="--c:'+t.cor+'"><p><b>'+(i+1)+'.</b> '+esc(x[0])+' <small>('+x[1].length+(/^\d+$/.test(x[1])?' dígitos':' letras')+')</small></p>'+boxHtml(i,x[1])+'<span class="fb"></span></div>'});
