 h+='<div class="card" style="--c:'+t.cor+'"><p>4. Qual foi a preferência mais escolhida? Escreva a 1ª palavra, uma letra em cada quadrinho. <small>('+FW.length+' letras)</small></p>'+boxHtml('tbq2',FW)+' <span class="fb"></span></div>';
 Q.forEach(function(x){h+='<div class="card" style="--c:'+t.cor+'"><p>'+esc(x[1])+'</p><input class="n" data-q="'+x[0]+'" inputmode="numeric" autocomplete="off" style="max-width:10em"> <span class="fb"></span></div>'});
 h+='<div class="card" style="--c:'+t.cor+'"><p>5. O que o dono do negócio deve fazer com esse resultado? Explique em uma frase.</p><textarea rows="2" id="tbOpen"></textarea></div><div class="nav"><span class="fb" id="tbfb"></span><button class="btn" id="tbChk">Conferir ✔</button></div><p class="mut">A pergunta 5 é aberta: chame o professor para conferir.</p>';
 stage.innerHTML=h;wireBar();wireBoxes(stage,function(i,w){logIt('Tabela: preferência mais escolhida = '+w,true);award('tbq2',4)},function(i,w){logIt('Tabela: preferência = '+w,false)});
 [].forEach.call(stage.querySelectorAll('input,textarea'),function(e){e.addEventListener('keydown',function(ev){ev.stopPropagation()})});
 var busy=false;stage.querySelector('#tbChk').onclick=function(){if(busy)return;busy=true;var btn=this;btn.disabled=true;var fb0=stage.querySelector('#tbfb');

   var g=stage.querySelector('.bxs[data-i="tbq2"]'),w=[].map.call(g.querySelectorAll('input'),function(z){return z.value}).join('');if(w===FW){ok++;award('tbq2',4)}

/* ---------- 7) pesquisa escrita (discursiva) ---------- */
function steps(t){return[
 {id:'publico',t:'Quem é o seu público?',q:'Você vai abrir um(a) '+t.neg+'. Quem seriam seus clientes? Descreva idade, onde moram e o que gostam.',min:25},
 {id:'conc',t:'Quem já vende isso?',q:'Cite 2 concorrentes (lugares ou pessoas que já vendem algo parecido) e diga o que eles fazem bem.',min:25},
 {id:'perg',t:'As 5 perguntas',q:'Crie 5 perguntas para descobrir o que o seu público quer.',dica:'Exemplos: '+t.ex.join(' · '),multi:5,min:8},
 {id:'amostra',t:'Quantas pessoas?',q:'Quantas pessoas você vai entrevistar e quem elas seriam? Por que esse número é suficiente?',min:25},
 {id:'dec',t:'Vale a pena?',q:'Com base na pesquisa, vale a pena lançar o negócio? Justifique e sugira um '+t.preco+'.',min:30}]}

var dsStep=0;
function actDs(){var t=T[tema],S=steps(t);if(dsStep>=S.length){dsStep=0;fimAct('ds');return hub()}var s=S[dsStep],v=R[tema][s.id];

 if(s.multi)h+=Array.apply(null,Array(s.multi)).map(function(_,i){return '<textarea data-m="'+i+'" rows="1" placeholder="Pergunta '+(i+1)+'">'+esc((v||[])[i]||'')+'</textarea>'}).join('');else h+='<textarea rows="4" data-s="1">'+esc(v||'')+'</textarea>';
 h+='</div><div class="nav"><button class="btn alt" id="ant"'+(dsStep?'':' disabled')+'>◀ Anterior</button><button class="btn" id="prox">'+(dsStep===S.length-1?'Terminar ✔':'Próximo ▶')+'</button></div><p class="mut">Estas respostas são abertas: chame o professor para conferir.</p>';
 stage.innerHTML=h;wireBar();
 function save(){R[tema][s.id]=s.multi?[].map.call(stage.querySelectorAll('[data-m]'),function(x){return x.value}):stage.querySelector('[data-s]').value;if(dsDone(s.id,s))award('ds'+s.id,6)}
 [].forEach.call(stage.querySelectorAll('textarea'),function(e){e.addEventListener('input',save);e.addEventListener('keydown',function(ev){ev.stopPropagation()})});
 stage.querySelector('#ant').onclick=function(){save();dsStep--;actDs()};stage.querySelector('#prox').onclick=function(){save();dsStep++;actDs()};
 [].forEach.call(stage.querySelectorAll('.pill'),function(b){b.onclick=function(){save();dsStep=+b.dataset.i;actDs()}})}
