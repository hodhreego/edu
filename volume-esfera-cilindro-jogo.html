<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volume da Esfera, Cilindro e Cone - Jogo</title>
<style>
:root{
  --m:0mm; --gap:1.2mm; --fen:11.5pt; --fpt:8.5pt; --fex:8pt; --ih:24mm; --tit:19pt; --sub:8.5pt; --rad:2.2mm; --pad:.6mm;
  --ink:#1b2440; --muted:#5b6585;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#d9dde6;font-family:"Segoe UI","Trebuchet MS",Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.folha{width:210mm;height:297mm;margin:8mm auto;background:#fff;padding:var(--m);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.25);position:relative;
  background-image:radial-gradient(circle at 100% 0,#e8f0ff 0,transparent 38%),radial-gradient(circle at 0 100%,#fff2e2 0,transparent 36%)}
.topo{display:flex;align-items:center;justify-content:space-between;gap:4mm;margin-bottom:1.6mm}
.topo h1{margin:0;font-size:var(--tit);line-height:1;letter-spacing:.3px;font-weight:800;color:#1f3a8a}
.topo h1 span{color:#e0501f}
.topo .sub{font-size:var(--sub);color:var(--muted);font-weight:600;margin-top:.6mm}
.ident{font-size:7.5pt;color:var(--muted);text-align:right;line-height:1.5}
.ident b{display:inline-block;border-bottom:1px solid #99a;min-width:62mm;height:4.5mm;vertical-align:bottom}
.legenda{display:flex;align-items:center;gap:5mm;font-size:8pt;color:var(--muted);margin-bottom:2mm;padding:.8mm 3mm;border:1px dashed #b7c0da;border-radius:99px;width:max-content;background:#fff}
.legenda svg{width:7mm;height:6mm;vertical-align:middle;margin-right:1mm}
.grade{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(7,1fr);gap:var(--gap)}
.card{--c:#1f5fbf;border:1.4px solid var(--c);border-radius:var(--rad);background:#fff;padding:var(--pad);display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:0;position:relative;overflow:hidden}
.card:nth-child(4n+2){--c:#1d8a5a}.card:nth-child(4n+3){--c:#e07a1f}.card:nth-child(4n+4){--c:#8a46c8}
.card .n{position:absolute;left:1.2mm;top:1.2mm;width:4mm;height:4mm;border-radius:50%;background:var(--c);color:#fff;font-size:5.5pt;font-weight:800;display:flex;align-items:center;justify-content:center}
.card .cena{width:100%;height:var(--ih);display:block;min-height:0;object-fit:contain;background:#fff;border-radius:2mm}
.en{font-size:var(--fen);font-weight:800;color:#0a2a8f;line-height:1.05;text-align:center;margin-top:.4mm}
.pt{font-size:var(--fpt);font-weight:700;color:#000;line-height:1.1;text-align:center}
.ex{font-size:var(--fex);color:#111;font-weight:500;text-align:center;line-height:1.25;margin-top:.6mm}
.ex i{display:block;color:#222}
.sem-frases .ex{display:none}
.rodape{font-size:6.5pt;color:var(--muted);text-align:center;margin-top:1.5mm}
.dash{stroke:#46506f;stroke-width:1.6;stroke-dasharray:2.5 3;fill:none;stroke-linecap:round}
.arr{stroke:#46506f;stroke-width:1.6;fill:none;stroke-linecap:round}

/* folha 2: recortar e colar (só desenhos) */
:root{--fz3:32pt;--cols2:7;--pd2:.2mm;--m2:0mm;--rh2:calc((297mm - 2*var(--m2) - 3*1.5mm - 2mm)/16)}
.folha2 .grade{display:block;overflow:visible}
.set{display:grid;grid-template-columns:repeat(var(--cols2),1fr);grid-auto-rows:auto}
.corte{height:1.2mm;border-top:2.4px solid #000;margin-top:.3mm}
.corte:last-child{display:none}
.rec{height:var(--rh2);border:2px dashed #000;display:flex;align-items:center;justify-content:center;padding:var(--pd2);background:#fff;min-height:0;min-width:0;margin:0 -1px -1px 0}
.rec .cena{width:100%;height:100%;display:block;object-fit:contain;background:#fff}
.instr{color:var(--muted)}
.folha2{padding:var(--m2);background-image:none}
.folha2 .topo{margin-bottom:.8mm;align-items:baseline}
.folha2 .topo h1{font-size:var(--t2);display:inline}
.folha2 .topo .sub{display:inline;font-size:calc(var(--t2)*.72);margin:0 0 0 2mm;font-weight:500}
.folha2 .ident{font-size:calc(var(--t2)*.72);line-height:1.2}
.folha2 .ident b{min-width:40mm;height:3mm}
.folha2 .instr{font-size:calc(var(--t2)*.72);margin-bottom:.8mm;line-height:1.2}
#folha4{padding-bottom:9mm!important}
#grade4{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(7,1fr);gap:0;min-height:0}
#grade4 .rec{height:auto;margin:0 -1px -1px 0;padding:1mm}
#grade4 .rec.cp .cap{line-height:1.25;overflow:visible;padding-bottom:.8mm}
.rec.cp{flex-direction:column;gap:.4mm}
.rec.cp .cena{width:100%;height:auto;flex:1 1 0;min-height:0}
.rec.cp .cap{flex:none;font-weight:900;font-size:12.5pt;line-height:.95;white-space:nowrap;text-align:center;color:#0a2a8f;max-width:100%;overflow:hidden}
.rec.txt{font-weight:900;font-size:var(--fz3);letter-spacing:0;text-align:center;line-height:1;color:#000;word-break:keep-all;padding:.6mm 1mm;overflow:hidden}
.rec.txt span{display:block}
/* painel */
.painel{position:fixed;right:10px;top:10px;z-index:99;font:12px/1.3 "Segoe UI",Arial,sans-serif;color:#222}
.painel>button{background:#1f3a8a;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.painel .corpo{display:none;margin-top:6px;background:#fff;border:1px solid #bbb;border-radius:10px;padding:10px 12px;width:270px;max-height:80vh;overflow:auto;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.painel.aberto .corpo{display:block}
.painel label{display:block;margin:6px 0 0;font-weight:600}
.painel label span{float:right;color:#555;font-weight:400}
.painel input[type=range]{width:100%}
.painel .bt{display:flex;gap:6px;margin-top:10px}
.painel .bt button{flex:1;padding:7px;border:1px solid #1f3a8a;background:#fff;color:#1f3a8a;border-radius:6px;cursor:pointer;font-weight:600}
.painel .bt button.p{background:#1f3a8a;color:#fff}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .painel{display:none!important}
  .folha{margin:0;box-shadow:none;height:297mm;break-after:page}
}

/* cartões grandes: 1 por página */
.folha.grande{background-image:none}
.grande .gc{flex:1;min-height:0;border:3px solid var(--c);border-radius:calc(var(--rad,2.2mm)*2.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5mm;padding:3mm 4mm 4mm;text-align:center;position:relative}
.grande .gn{position:absolute;left:4mm;top:4mm;width:11mm;height:11mm;border-radius:50%;background:var(--c);color:#fff;font:800 14pt Arial;display:flex;align-items:center;justify-content:center;z-index:2}
.grande .cena{flex:0 1 auto;min-height:0;width:100%;height:auto;max-height:68%;display:block;background:#fff;object-fit:contain;border-radius:calc(var(--rad,2.2mm)*1.8)}
.grande .gen{flex:none;font-size:66pt;font-weight:900;color:#0a2a8f;line-height:1;letter-spacing:.5px;-webkit-text-stroke:.6px #0a2a8f}
.grande .gpt{flex:none;font-size:28pt;font-weight:800;color:#000;line-height:1.05}
.grande .gex{flex:none;font-size:22pt;font-weight:600;color:#1a1a1a;line-height:1.25}
.grande .gex i{display:block;color:#333;font-weight:600}
.sem-grandes #grandes{display:none}
@media print{.sem-grandes #grandes{display:none}}

/* === RGP Aula Toolkit === */
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#rgpBar{position:fixed;left:12px;bottom:12px;z-index:99999;display:flex;gap:6px;align-items:center;background:#111;color:#fff;border-radius:12px;padding:6px 8px;box-shadow:0 4px 18px #0005;font:600 12px/1 "Segoe UI",Arial,sans-serif}
#rgpBar button{border:0;border-radius:8px;background:#2b2b2b;color:#fff;padding:7px 10px;font:inherit;cursor:pointer;display:flex;gap:5px;align-items:center;white-space:nowrap}
#rgpBar button:hover{background:#3a3a3a}
#rgpBar button[aria-pressed="true"]{background:#1f5fd6}
#rgpTimer{position:fixed;left:12px;bottom:62px;z-index:99999;background:#fff;color:#111;border:2px solid #111;border-radius:12px;padding:10px;box-shadow:0 10px 30px #0004;display:none;font:600 13px/1.3 "Segoe UI",Arial,sans-serif;width:250px}
#rgpTimer.on{display:block}
#rgpTimer .big{font-size:34px;font-weight:900;text-align:center;letter-spacing:1px;margin:3px 0 7px}
#rgpTimer .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
#rgpTimer button{flex:1;border:1px solid #bbb;background:#f4f6fa;border-radius:7px;padding:6px 5px;cursor:pointer;font:inherit;color:#111;min-width:42px}
#rgpTimer button.primary{background:#1f5fd6;color:#fff;border-color:#1f5fd6}
#rgpTimer .hint{font-size:11px;color:#555;font-weight:400;text-align:center;margin-top:7px}
#rgpBar button:focus-visible,#rgpTimer button:focus-visible,#btn:focus-visible,#abrir:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
.pgb{position:absolute;right:6mm;bottom:2.6mm;font-size:7.5pt;color:#6b7280;font-weight:700;letter-spacing:.04em;pointer-events:none}
body.rgp-so-aluno .folha.gab{display:none!important}
@media print{#rgpBar,#rgpTimer{display:none!important}body.rgp-so-aluno .folha.gab{display:none!important}}

<script>
(function(){
  if(window.__rgpToolkit) return; window.__rgpToolkit=true;
  const $=s=>document.querySelector(s);
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  let total=300,left=300,tick=null;
  const clock=$('#rgpClock'),lbl=$('#rgpTimerLbl'),start=$('#rgpStart'),panel=$('#rgpTimer'),tbtn=$('#rgpTimerBtn');
  function paint(){clock.textContent=fmt(left);lbl.textContent=fmt(left);clock.setAttribute('aria-live',left<=10?'assertive':'off')}
  function stop(){clearInterval(tick);tick=null;start.textContent='Iniciar'}
  function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.25,a.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.14);o.start(a.currentTime+d);o.stop(a.currentTime+d+.15)})}catch(e){}}
  function run(){if(tick)return;if(left<=0){left=total;paint()}start.textContent='Pausar';tick=setInterval(()=>{left--;paint();if(left<=0){stop();beep()}},1000)}
  tbtn&&tbtn.addEventListener('click',()=>{panel.classList.toggle('on');tbtn.setAttribute('aria-expanded',panel.classList.contains('on'))});
  start&&start.addEventListener('click',()=>{tick?stop():run()});
  $('#rgpReset')&&$('#rgpReset').addEventListener('click',()=>{stop();left=total;paint()});
  $('#rgpClose')&&$('#rgpClose').addEventListener('click',()=>{panel.classList.remove('on');tbtn.setAttribute('aria-expanded','false')});
  document.querySelectorAll('[data-rgp-min]').forEach(b=>b.addEventListener('click',()=>{stop();total=left=+b.dataset.rgpMin*60;paint()}));
  $('#rgpPrintBtn')&&$('#rgpPrintBtn').addEventListener('click',()=>window.print());
  $('#rgpFullBtn')&&$('#rgpFullBtn').addEventListener('click',()=>{
    if(!document.fullscreenElement){(document.documentElement.requestFullscreen||function(){}).call(document.documentElement);$('#rgpFullLbl').textContent='Sair'}
    else{(document.exitFullscreen||function(){}).call(document);$('#rgpFullLbl').textContent='Tela cheia'}
  });
  document.addEventListener('fullscreenchange',()=>{const e=$('#rgpFullLbl');if(e)e.textContent=document.fullscreenElement?'Sair':'Tela cheia'});
  const key=$('#rgpKeyBtn');
  if(key){key.addEventListener('click',()=>{const on=document.body.classList.toggle('rgp-so-aluno');key.setAttribute('aria-pressed',on?'true':'false');key.textContent=on?'🔑 Mostrar gabarito':'🔑 Gabarito'})}
  document.addEventListener('keydown',e=>{
    const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
    if(e.key==='p'||e.key==='P'){e.preventDefault();window.print()}
    else if(e.key==='t'||e.key==='T'){e.preventDefault();tbtn&&tbtn.click()}
    else if(e.key==='g'||e.key==='G'){e.preventDefault();key&&key.click()}
    else if(e.key==='Escape'){panel.classList.remove('on');tbtn&&tbtn.setAttribute('aria-expanded','false')}
  });
  function pages(){
    const arr=[...document.querySelectorAll('.folha')];
    arr.forEach((f,i)=>{
      
      if(/gabarito/i.test((f.textContent||'').slice(0,900)))f.classList.add('gab');
    });
    const n=document.querySelectorAll('.folha.gab').length;
    if(key)key.style.display=n?'':'none';
  }
  function lang(){document.querySelectorAll('.en,.gen,.gex,.card .en,.bg span,.rec.txt span').forEach(e=>{if(!e.lang)e.lang='en'})}
  const oldBtn=$('#btn');
  if(oldBtn){oldBtn.setAttribute('aria-label',oldBtn.getAttribute('title')||'Ajustes da página');oldBtn.setAttribute('aria-expanded','false');oldBtn.addEventListener('click',()=>oldBtn.setAttribute('aria-expanded',oldBtn.getAttribute('aria-expanded')==='true'?'false':'true'))}
  const abrir=$('#abrir');
  if(abrir){abrir.setAttribute('aria-expanded','false');abrir.addEventListener('click',()=>abrir.setAttribute('aria-expanded',document.getElementById('painel')?.classList.contains('aberto')?'true':'false'))}
  window.addEventListener('load',()=>{setTimeout(()=>{pages();lang();paint()},120);setTimeout(()=>{pages();lang()},900)});
  pages();lang();paint();
})();
</script>

<script id="fala">
(function(){
 var on=true,voz=null,S=window.speechSynthesis;

 function pick(){if(!S)return;var v=S.getVoices().filter(function(x){return /^pt[-_]BR/i.test(x.lang)});
  voz=v.filter(function(x){return /natural|online|google|francisca|antonio|luciana|maria|heloisa/i.test(x.name)})[0]||v[0]||S.getVoices().filter(function(x){return /^pt/i.test(x.lang)})[0]||null}
 if(S){pick();S.onvoiceschanged=pick}
 
 var DEN={2:['meio','meios'],3:['terço','terços'],4:['quarto','quartos'],5:['quinto','quintos'],6:['sexto','sextos'],7:['sétimo','sétimos'],8:['oitavo','oitavos'],9:['nono','nonos'],10:['décimo','décimos'],12:['doze avos','doze avos'],100:['centésimo','centésimos']};
 function norm(t){
  t=t.replace(/(\d+)\s*\/\s*(\d+)/g,function(m,n,d){n=+n;d=+d;var x=DEN[d];return n+' '+(x?x[n===1?0:1]:'sobre '+d)});
  t=t.replace(/R\$\s*(\d+),(\d{2})/g,function(m,r,c){return r+' reais e '+(+c)+' centavos'}).replace(/R\$\s*(\d+)/g,'$1 reais');
  t=t.replace(/(\d+)\s*%/g,'$1 por cento').replace(/[−–-](?=\s*\d)/g,' menos ').replace(/\+/g,' mais ').replace(/[×*]/g,' vezes ').replace(/÷/g,' dividido por ').replace(/=/g,' igual a ');
  return t}
 function falar(t){if(!on||!S||!t)return;S.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';if(voz)u.voice=voz;u.rate=.8;S.speak(u)}
 window.falar=falar;
 b.addEventListener('click',function(){on=!on;try{localStorage.setItem('fala_off',on?'0':'1')}catch(e){}ui();if(on)falar('Hello')});
 ui();
 document.addEventListener('pointerdown',function(e){

 },true);
