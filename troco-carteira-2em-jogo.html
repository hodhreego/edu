function pairs(w){const o=[];for(let i=0;i<w.length;i++){o.push([i]);for(let j=i+1;j<w.length;j++)o.push([i,j])}return o}
function exact(w,tot){for(let m=1;m<(1<<w.length);m++){let s=0;for(let i=0;i<w.length;i++)if(m>>i&1)s+=w[i];if(s===tot)return true}return false}

function one(o){
 for(let g=0;g<600;g++){
  const pp=prods(o.n).map(x=>({e:x[0],n:x[1],p:Math.max(o.step,Math.round(x[2]*(.7+Math.random()*.6)/o.step)*o.step)}));
  const tot=pp.reduce((a,b)=>a+b.p,0);
  const fin=Math.round(o.mod==='d'?tot*.9:o.mod==='t'?tot*1.1:tot);
  if(fin<300||fin>o.max)continue;
  const w=[];for(let i=0;i<4;i++)w.push(pick(o.pool));(o.coins||[]).forEach(c=>{if(Math.random()<.7)w.push(c)});
  w.sort((a,b)=>b-a);
  if(exact(w,fin))continue;
  const ok=pairs(w).map(ix=>ix.reduce((a,i)=>a+w[i],0)).filter(s=>s>fin);
  if(!ok.length)continue;
  const best=Math.min(...ok);if(best-fin>9000)continue;
  const L=pp.map(x=>x.e+' <b>'+x.n+'</b> ('+fmt(x.p)+')');
  let m=o.mod==='d'?' A compra toda tem <b>10% de desconto</b>.':o.mod==='t'?' É cobrada <b>taxa de serviço de 10%</b> sobre o total.':'';
  const txt='Um cliente comprou '+lst(L)+'.'+m+' O total a pagar é <b>'+fmt(fin)+'</b>. Na carteira, ele tem apenas: '+w.map(fmt).join(' · ')+'. Ele <b>não consegue pagar o valor exato</b>. <b>Arraste 1 ou 2 notas/moedas da carteira para o pagamento e depois monte o troco.</b>';
  return {items:pp,total:fin,paid:best,target:best-fin,wallet:w,txt:txt}}
 return null}
