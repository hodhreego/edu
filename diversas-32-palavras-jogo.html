<style>
:root{--bg:#FFF8E1;--azul:#1E88E5;--laranja:#FB8C00;--verde:#43A047;--rosa:#E91E63;--roxo:#8E24AA;--texto:#263238}

body{margin:0;font-family:Verdana,Arial,sans-serif;background:var(--bg);color:var(--texto);min-height:100vh}
.tela{display:none;padding:14px;max-width:980px;margin:0 auto}
.tela.on{display:block}
h1{text-align:center;color:var(--azul);margin:6px 0 4px;font-size:clamp(1.4rem,4vw,2.1rem)}
.sub{text-align:center;color:#546E7A;margin:0 0 14px}

.cartao{background:#fff;border:4px solid var(--c,#1E88E5);border-radius:20px;padding:14px;text-align:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12);user-select:none}

.barra{display:flex;align-items:center;gap:10px;margin-bottom:10px}

.fase{background:#fff;border-radius:20px;border:4px solid var(--c);padding:16px;text-align:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12)}

.quadro{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.1);text-align:center}

.fig{width:min(46vw,230px);height:min(46vw,230px);object-fit:contain;display:block;margin:0 auto 8px}
.alvo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:68px;margin:10px 0;padding:10px;border:3px dashed #90A4AE;border-radius:16px;background:#FAFAFA}
.peca{min-width:56px;min-height:56px;padding:6px 14px;border:3px solid var(--azul);border-radius:14px;background:#fff;font:bold clamp(1.3rem,4.6vw,2rem) Verdana,Arial,sans-serif;color:var(--azul);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15);text-transform:uppercase;user-select:none}

.banco{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}

.op{background:#fff;border:4px solid #B0BEC5;border-radius:18px;padding:8px;cursor:pointer;text-align:center;font-weight:bold;font-size:1.05rem;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}

.msg.bom{color:var(--verde)}.msg.ruim{color:#E53935}
.acoes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.hist{background:#fff;border-radius:22px;border:4px solid var(--c,#8E24AA);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.hist .cena{font-size:clamp(2.6rem,11vw,4.6rem);text-align:center;padding:14px 8px;background:linear-gradient(135deg,var(--g1),var(--g2));letter-spacing:6px}
.hist .corpo{padding:14px 18px 6px}
.hist .corpo h2{margin:0 0 8px;color:var(--c,#8E24AA)}

.fim{text-align:center}
.fim .grande{font-size:4rem;letter-spacing:6px;color:#FFB300}

#dv-top{position:fixed;left:0;right:0;top:calc(var(--eh,0px) + 52px);height:0;z-index:30;pointer-events:none}

.voa{position:fixed;right:70px;top:56px;z-index:31;font:900 1.7rem Verdana,Arial,sans-serif;pointer-events:none;animation:voa 1.2s forwards}

.res{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(255,255,255,.5);animation:res 1.1s forwards}
.res svg{width:min(52vw,240px);height:min(52vw,240px);filter:drop-shadow(0 0 10px rgba(255,255,255,.95))}

.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}

.fig-a.bloq{border-color:#CFD8DC;background:#ECEFF1;color:#90A4AE}
.fig-a.bloq img{filter:brightness(0) opacity(.18)}
.fig-a.nova{animation:nova 1.6s ease-out 3}

.premio{background:#FFF8E1;border:4px solid #FFB300;border-radius:20px;padding:12px;margin-top:12px}

.medalhas{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px;font-size:2.2rem}
.medalhas span.b{filter:grayscale(1) opacity(.3)}

.zap{display:inline-flex;align-items:center;gap:10px;background:#d9fdd3;border-radius:18px 18px 18px 4px;padding:8px 14px 8px 8px;box-shadow:0 2px 0 rgba(0,0,0,.18);cursor:pointer;user-select:none;margin:0 auto 10px;border:0;font:inherit;min-width:230px}
.zap:active{transform:scale(.97)}

.zap .on{display:flex;align-items:center;gap:2.5px;height:34px;flex:1}

.cn{position:fixed;z-index:45;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffc400 60%,#c98a00);border:2px solid #9a6a00;display:flex;align-items:center;justify-content:center;font:900 .95rem Verdana,sans-serif;color:#8a5a00;pointer-events:none;box-shadow:0 2px 4px rgba(0,0,0,.3);animation:cnvoa .9s cubic-bezier(.5,0,.8,.6) forwards}

.langbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 10px}
.langbar button{border:3px solid #B0BEC5;background:#fff;border-radius:99px;padding:6px 12px;font:700 .9rem Verdana,Arial,sans-serif;cursor:pointer;min-height:40px}
.langbar button.on{border-color:var(--azul);background:#E3F2FD;color:var(--azul)}
.pos{min-width:56px;min-height:56px;padding:6px 14px;border:3px dashed #90A4AE;border-radius:14px;background:#fff;color:#B0BEC5;font:bold 1.3rem Verdana,Arial,sans-serif;cursor:default}
.pos.alvo-on{border-color:var(--verde);background:#E8F5E9;transform:scale(1.08)}
.peca{touch-action:none}
.peca.fantasma{position:fixed;z-index:60;transform:translate(-50%,-50%) scale(1.12);pointer-events:none;box-shadow:0 8px 18px rgba(0,0,0,.3);opacity:.92}
.alvo .peca{touch-action:manipulation}
.cn{width:60px!important;height:60px!important;background:#e0b84a center/cover no-repeat;border:2px solid #0006!important;font-size:0!important;box-shadow:0 3px 8px #0005}.dv-moedas i{background:url(img/aula47/m1.webp) center/cover!important;width:40px!important;height:40px!important;border:2px solid #0006!important}
.dv-moedas{display:none!important}
</style>
