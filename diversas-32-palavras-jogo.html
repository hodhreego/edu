<style>
:root{--bg:#FFF8E1;--azul:#1E88E5;--laranja:#FB8C00;--verde:#43A047;--rosa:#E91E63;--roxo:#8E24AA;--texto:#263238}

body{margin:0;font-family:Verdana,Arial,sans-serif;background:var(--bg);color:var(--texto);min-height:100vh}
.tela{display:none;padding:14px;max-width:980px;margin:0 auto}

h1{text-align:center;color:var(--azul);margin:6px 0 4px;font-size:clamp(1.4rem,4vw,2.1rem)}
.sub{text-align:center;color:#546E7A;margin:0 0 14px}

.cartao{background:#fff;border:4px solid var(--c,#1E88E5);border-radius:20px;padding:14px;text-align:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12);user-select:none}

.est .v{color:#CFD8DC}
.barra{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.barra .tit{flex:1;text-align:center;font-weight:bold;font-size:clamp(1.05rem,3.2vw,1.5rem)}

.prog{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}

.frase-txt{font-size:clamp(1.3rem,4.4vw,2rem);font-weight:bold;margin:8px 0;line-height:1.5}
.lacuna{display:inline-block;min-width:90px;border-bottom:4px solid var(--laranja);color:var(--verde)}

.acoes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.hist{background:#fff;border-radius:22px;border:4px solid var(--c,#8E24AA);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.hist .cena{font-size:clamp(2.6rem,11vw,4.6rem);text-align:center;padding:14px 8px;background:linear-gradient(135deg,var(--g1),var(--g2));letter-spacing:6px}
.hist .corpo{padding:14px 18px 6px}
.hist .corpo h2{margin:0 0 8px;color:var(--c,#8E24AA)}

.fim{text-align:center}
.fim .grande{font-size:4rem;letter-spacing:6px;color:#FFB300}
.fim .grande .v{color:#CFD8DC}

.voa{position:fixed;right:70px;top:56px;z-index:31;font:900 1.7rem Verdana,Arial,sans-serif;pointer-events:none;animation:voa 1.2s forwards}
.voa.mais{color:#16a34a;text-shadow:0 0 6px #fff}.voa.menos{color:#dc2626;text-shadow:0 0 6px #fff}

.res{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(255,255,255,.5);animation:res 1.1s forwards}

.cn{position:fixed;z-index:45;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffc400 60%,#c98a00);border:2px solid #9a6a00;display:flex;align-items:center;justify-content:center;font:900 .95rem Verdana,sans-serif;color:#8a5a00;pointer-events:none;box-shadow:0 2px 4px rgba(0,0,0,.3);animation:cnvoa .9s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes cnvoa{0%{transform:translate(0,0) scale(.4) rotateY(0);opacity:0}15%{opacity:1;transform:translate(var(--ox),var(--oy)) scale(1) rotateY(180deg)}100%{transform:translate(var(--dx),var(--dy)) scale(.6) rotateY(720deg);opacity:.9}}
.cn.chuva{animation:cnchuva 2.2s linear forwards}
@keyframes cnchuva{0%{transform:translateY(-40px) rotateY(0)}100%{transform:translateY(112vh) rotateY(1080deg)}}
</style>

  for(var i=0;i<n;i++)(function(i){setTimeout(function(){
    var c=document.createElement("div");c.className="cn";c.textContent="$";c.style.left=cx-15+"px";c.style.top=cy-15+"px";
    c.style.setProperty("--ox",(Math.random()*160-80)+"px");c.style.setProperty("--oy",(Math.random()*-90-10)+"px");
    c.style.setProperty("--dx",(al.left+al.width/2-cx)+"px");c.style.setProperty("--dy",(al.top+al.height/2-cy)+"px");
    $("dv-fx").appendChild(c);setTimeout(function(){c.remove();tom(1200+i*80,"sine",.06)},900)},i*90)})(i)
}
function chuvaMoedas(n){for(var i=0;i<n;i++)(function(i){setTimeout(function(){var c=document.createElement("div");c.className="cn chuva";c.textContent="$";c.style.left=Math.random()*96+"vw";c.style.top="0";$("dv-fx").appendChild(c);setTimeout(function(){c.remove()},2300)},i*70)})(i)}
function moeda(d){
  MOEDAS=Math.max(0,MOEDAS+d);salvaM();var m=$("dv-moedas"),n=$("m-n");if(n)n.textContent=MOEDAS;
  if(m){m.classList.remove("up","down");void m.offsetWidth;m.classList.add(d>0?"up":"down")}
  var v=document.createElement("div");v.className="voa "+(d>0?"mais":"menos");v.textContent=(d>0?"+":"−")+Math.abs(d);document.body.appendChild(v);setTimeout(function(){v.remove()},1300);
  if(d>0)moedasVoam(d>=50?8:5)
}
var CERTO_SVG='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#22c55e"/><path d="M6 12.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    ERRO_SVG='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#ef4444"/><path d="M7.5 7.5l9 9M16.5 7.5l-9 9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>';
function resposta(ok){var r=document.createElement("div");r.className="res";r.innerHTML=ok?CERTO_SVG:ERRO_SVG;document.body.appendChild(r);setTimeout(function(){r.remove()},1150)}
function totalEstrelas(){var t=0;for(var k in PROG)t+=PROG[k]||0;return t}
function figurinhas(){return Math.min(W.length,Math.floor(totalEstrelas()/2))}
function salva(){try{localStorage.setItem("div32_prog",JSON.stringify(PROG))}catch(e){}}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function estrelas(n,max){var s="";for(var i=1;i<=(max||5);i++)s+=i<=n?"★":'<span class="v">★</span>';return s}
function tela(id){document.querySelectorAll(".tela").forEach(function(t){t.classList.remove("on")});$(id).classList.add("on");window.scrollTo(0,0)}

/* ===== Atividades: id, nome, cor, ícone, fases ===== */
var ATV=[
{id:"letras",n:"Organize as letras",ic:"🔠",c:"#1E88E5",d:"Veja a figura e coloque as letras na ordem certa para formar a palavra.",f:["Palavras curtas","Palavras médias","Palavras longas"]},
{id:"silabas",n:"Ouça e organize as sílabas",ic:"👂",c:"#E91E63",d:"Ouça o som de cada sílaba e monte a palavra na ordem certa.",f:["2 sílabas","3 sílabas","Só pelo som (sem figura)"]},
{id:"som",n:"Qual figura tem esse som?",ic:"🎧",c:"#43A047",d:"Ouça a sílaba e toque na figura cuja palavra tem esse som.",f:["Começa com...","Termina com...","Começa ou termina"]},
{id:"frase",n:"Organize a frase",ic:"📝",c:"#FB8C00",d:"Toque nas palavras para montar a frase na ordem correta.",f:["Frases curtas","Frases médias","Frases longas"]},
{id:"complete",n:"Complete a frase",ic:"🧩",c:"#8E24AA",d:"Escolha a figura que completa a frase.",f:["Fácil","Médio","Desafio"]},
{id:"leitura",n:"Fichas de leitura",ic:"📚",c:"#00897B",d:"Leia histórias clássicas e responda às perguntas.",f:HI.map(function(h){return h.t})}
];
function chave(a,f){return a.id+"-"+f}
function desbloq(a,f){return f===0||PROG[chave(a,f-1)]>0}

function abreAlbum(){
  var n=figurinhas(),e=totalEstrelas(),g=$("a-grade");g.innerHTML="";
  $("a-txt").textContent="Você tem "+e+" estrelas e "+MOEDAS+" moedas. A cada 2 estrelas ganha uma figurinha nova!";
  var M=[[10,"🥉","Bronze (10 ⭐)"],[30,"🥈","Prata (30 ⭐)"],[60,"🥇","Ouro (60 ⭐)"],[100,"🏆","Campeão (100 ⭐)"]];
  $("a-med").innerHTML=M.map(function(m){return '<span class="'+(e>=m[0]?"":"b")+'" title="'+m[2]+'">'+m[1]+'</span>'}).join("");
  W.forEach(function(w,i){var d=document.createElement("div");d.className="fig-a"+(i<n?"":" bloq");d.innerHTML=img(w,"")+"<br>"+(i<n?w.p:"?");g.appendChild(d)});
  tela("t-album");
}
function irMenu(){
  if($("m-n"))$("m-n").textContent=MOEDAS;
  var g=$("g-menu");g.innerHTML="";
  ATV.forEach(function(a,i){
    var tot=0;a.f.forEach(function(_,f){tot+=PROG[chave(a,f)]||0});
    var c=document.createElement("div");c.className="cartao";c.style.setProperty("--c",a.c);
    c.innerHTML='<span class="ico">'+a.ic+'</span><b>'+a.n+'</b><small>'+a.d+'</small><div class="est">'+estrelas(tot,5*a.f.length).replace(/(<span class="v">★<\/span>)+/,function(m){return ""})+' </div><small>'+tot+' de '+5*a.f.length+' estrelas</small>';
    c.querySelector(".est").innerHTML=tot?"★".repeat(Math.min(5,Math.ceil(tot/a.f.length))):'<span class="v">★★★★★</span>';
    c.onclick=function(){abreFases(i)};g.appendChild(c)});
  tela("t-menu");
}
var A=null,FI=0,Q=[],QI=0,ERROS=0,ERROS_Q=0,TRAVA=false;
function abreFases(i){
  A=ATV[i];$("f-tit").textContent=A.ic+" "+A.n;$("f-desc").textContent=A.d;
  var g=$("g-fases");g.innerHTML="";
  A.f.forEach(function(nome,f){
    var ok=desbloq(A,f),e=PROG[chave(A,f)]||0,d=document.createElement("div");
    d.className="fase"+(ok?"":" trava");d.style.setProperty("--c",A.c);
    d.innerHTML='<div class="n">'+(ok?"Fase "+(f+1):"🔒 Fase "+(f+1))+'</div><small>'+nome+'</small><div class="est">'+estrelas(e)+'</div>';
    d.onclick=function(){if(ok)inicia(f);else{tom(160,"sawtooth",.2)}};g.appendChild(d)});
  tela("t-fases");
}
function sair(){clearTimeout(AUTO);try{speechSynthesis.cancel()}catch(e){};abreFases(ATV.indexOf(A))}

/* ===== Montagem das rodadas ===== */
function pool(f){
  var L=function(w){return w.p.replace(/[^a-zçãõáéíóúâêôà]/gi,"").length};
  if(A.id==="letras")return W.filter(function(w){var n=L(w);return f===0?n<=4:f===1?(n>=5&&n<=6):n>=7});
  if(A.id==="silabas")return W.filter(function(w){var n=w.s.length;return f===0?n===2:f===1?n>=3:n>=2});
  return W;
}
function inicia(f){
  FI=f;QI=0;ERROS=0;Q=[];
  if(A.id==="letras"||A.id==="silabas"){var p=pool(f);if(p.length<5)p=W;Q=sh(p).slice(0,5)}
  else if(A.id==="som"){Q=monta_som(f)}
  else if(A.id==="frase"){Q=sh(FR[f]).slice(0,5)}
  else if(A.id==="complete"){Q=sh(CF[f]).slice(0,5)}
  else if(A.id==="leitura"){Q=HI[f].q.map(function(x){return x})}
  $("j-tit").textContent=A.ic+" Fase "+(f+1);
  tela("t-jogo");
  if(A.id==="leitura"){mostraHistoria();return}
  proxima(true);
}
function monta_som(f){
  var out=[],ws=sh(W);
  for(var k=0;k<ws.length&&out.length<5;k++){
    var w=ws[k],modo=f===0?"c":f===1?"t":(Math.random()<.5?"c":"t");
    var sil=(modo==="c"?w.s[0]:w.s[w.s.length-1]).toLowerCase();
    if(w.s.length<2&&modo==="t")continue;
    var ok=function(x){var s=modo==="c"?x.s[0]:x.s[x.s.length-1];return s.toLowerCase()===sil};
    var maus=sh(W.filter(function(x){return !ok(x)&&x!==w})).slice(0,2);
    out.push({w:w,sil:sil,modo:modo,ops:sh([w].concat(maus))});
  }
  return out;
}
function bolinhas(){
  var h="",n=Q.length;for(var i=0;i<n;i++)h+='<i class="'+(i<QI?"ok":i===QI?"at":"")+'"></i>';$("j-prog").innerHTML=h;
}
function msg(t,c){var m=$("j-msg");m.textContent=t||"";m.className="msg "+(c||"")}

/* ===== Uma rodada ===== */
var OUVIR=function(){};
var BARRAS=[10,18,26,14,30,22,12,28,20,8,24,30,16,10,26,18,12,22,28,14,8,20];
function zapHtml(){return '<button type="button" class="zap" id="zap" aria-label="Ouvir" onclick="ouvir()"><span class="pl"><svg class="pp" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="pa" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></span><span class="on">'+BARRAS.map(function(h){return '<i style="height:'+h+'px"></i>'}).join("")+'</span><span class="t">0:03</span></button><br>'}
var ZT=null,AUTO=null;
function ouvir(){var z=$("zap");if(z){z.classList.add("tocando");clearTimeout(ZT);ZT=setTimeout(function(){var q=$("zap");if(q)q.classList.remove("tocando")},3200)}OUVIR()}
function proxima(primeira){
  if(!primeira)QI++;
  if(QI>=Q.length){fimFase();return}
  ERROS_Q=0;TRAVA=false;bolinhas();msg("");
  var q=Q[QI],qd=$("j-quadro");
  
  if(A.id==="letras")rLetras(q,qd);
  else if(A.id==="silabas")rSilabas(q,qd);
  else if(A.id==="som")rSom(q,qd);
  else if(A.id==="frase")rFrase(q,qd);
  else if(A.id==="complete")rComplete(q,qd);
  else if(A.id==="leitura")rPergunta(q,qd);
  qd.insertAdjacentHTML("afterbegin",zapHtml());
  clearTimeout(AUTO);AUTO=setTimeout(ouvir,600);
}
function erra(el){
  ERROS++;ERROS_Q++;tom(160,"sawtooth",.2);moeda(-10);resposta(false);msg("Tente de novo!","ruim");
  if(el){el.classList.add("erro");setTimeout(function(){el.classList.remove("erro")},600)}
}
function acerta(txt,falar){
  TRAVA=true;tom(660,"sine",.2);moeda(15);resposta(true);msg("Muito bem! "+(txt||""),"bom");if(falar)fala(falar);
  setTimeout(function(){proxima()},falar?Math.max(1900,falar.length*90+600):1100);
}

/* Montar sequência de peças (letras, sílabas, palavras) */
function montador(qd,cab,pecas,certa,cls,aoFim){
  qd.innerHTML=cab+'<div class="alvo" id="alvo"></div><div class="banco" id="banco"></div><div class="acoes"><button class="btn cz" id="bdesf">↩ Desfazer</button></div>';
  var alvo=$("alvo"),banco=$("banco"),ordem=sh(pecas.map(function(p,i){return i}));
  if(pecas.length>1){var tent=0;while(ordem.every(function(v,i){return v===i})&&tent++<10)ordem=sh(ordem)}
  var esc=[];
  function pinta(){
    alvo.innerHTML="";
    esc.forEach(function(ix){var b=document.createElement("button");b.className="peca "+cls;b.textContent=pecas[ix];alvo.appendChild(b)});
    banco.querySelectorAll(".peca").forEach(function(b){b.classList.toggle("usada",esc.indexOf(+b.dataset.i)>=0)});
  }
  ordem.forEach(function(ix){var b=document.createElement("button");b.className="peca "+cls;b.textContent=pecas[ix];b.dataset.i=ix;
    b.onclick=function(){
      if(TRAVA)return;
      var pos=esc.length;
      if(pecas[ix]===certa[pos]){esc.push(ix);tom(500+pos*60,"sine",.12);if(cls==="sil"||cls==="fr")fala(pecas[ix].toLowerCase());pinta();msg("");
        if(esc.length===certa.length)aoFim()}
      else erra(b)};
    banco.appendChild(b)});
  $("bdesf").onclick=function(){if(!TRAVA){esc.pop();pinta()}};
}
function rLetras(w,qd){
  var letras=w.p.toUpperCase().split("");
  OUVIR=function(){fala("Coloque as letras na ordem, para formar a palavra. ... "+w.p)};
  montador(qd,img(w)+'<div class="ord">Coloque as letras na ordem para formar a palavra:</div>',letras,letras,"let",function(){acerta(w.p.toUpperCase()+"!",w.p)});
}
function rSilabas(w,qd){
  OUVIR=function(){fala("Ouça a palavra. ... "+w.p+". ... Agora toque nas sílabas, na ordem certa.")};
  var fig=FI===2?'<div style="font-size:4rem">🔊</div>':img(w);
  qd.innerHTML="";
  montador(qd,fig+'<div class="ord">Ouça a palavra. Toque nas sílabas na ordem certa (cada toque fala a sílaba):</div>',w.s,w.s,"sil",function(){acerta(w.s.join("-")+"!",w.p)});
}
function rSom(q,qd){
  OUVIR=function(){fala("Qual figura "+(q.modo==="c"?"começa":"termina")+" com o som: ... "+q.sil+" ... ? Toque na figura certa.")};
  qd.innerHTML='<div style="font-size:3.4rem">🎧</div><div class="frase-txt">Qual figura '+(q.modo==="c"?"<u>começa</u>":"<u>termina</u>")+' com o som <span style="color:var(--rosa);font-size:1.3em">'+q.sil.toUpperCase()+'</span>?</div><div class="opcoes" id="ops"></div>';
  q.ops.forEach(function(w){var d=document.createElement("div");d.className="op";d.innerHTML=img(w,"")+"<span>"+w.p+"</span>";
    d.onclick=function(){if(TRAVA)return;if(w===q.w){d.classList.add("certo");acerta(q.w.p.toUpperCase()+"!",q.w.p)}else{erra(d);fala(w.p)}};$("ops").appendChild(d)});
}
function rFrase(f,qd){
  var palavras=f.replace(/[.!?]$/,"").split(" "),fim=f.slice(-1);
  var pecas=palavras.slice(),certa=palavras.slice();
  OUVIR=function(){fala("Organize a frase. Ouça. ... "+f+" ... Agora toque nas palavras, na ordem certa.")};
  montador(qd,'<div style="font-size:3rem">📝</div><div class="ord">Toque nas palavras para formar a frase correta:</div>',pecas,certa,"fr",function(){acerta("",f)});
}
function rComplete(c,qd){
  var w=PW[c[1]];
  var partes=c[0].split("___");
  OUVIR=function(){fala("Complete a frase. ... "+c[0].replace("___"," ... qual figura? ... ")+" Toque na figura certa.")};
  qd.innerHTML='<div class="frase-txt">'+partes[0]+'<span class="lacuna" id="lac">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>'+partes[1]+'</div><div class="opcoes" id="ops"></div>';
  var ops=sh([w].concat(sh(W.filter(function(x){return x!==w})).slice(0,2)));
  ops.forEach(function(x){var d=document.createElement("div");d.className="op";d.innerHTML=img(x,"")+"<span>"+x.p+"</span>";
    d.onclick=function(){if(TRAVA)return;if(x===w){d.classList.add("certo");$("lac").textContent=w.p;acerta("",c[0].replace("___",w.p))}else{erra(d);fala(x.p)}};$("ops").appendChild(d)});
}
/* Fichas de leitura */
function mostraHistoria(){
  var h=HI[FI];$("j-prog").innerHTML="";msg("");
  OUVIR=function(){fala(h.tx.join(" "))};
  $("j-quadro").innerHTML=zapHtml()+'<div class="hist" style="--c:'+h.c+';--g1:'+h.g[0]+';--g2:'+h.g[1]+'"><div class="cena">'+h.e+'</div><div class="corpo"><h2>'+h.t+'</h2>'+h.tx.map(function(p){return"<p>"+p+"</p>"}).join("")+'</div></div><div class="acoes"><button class="btn vd" onclick="comecaPerguntas()">Já li! Ir para as perguntas ➡</button></div>';
}
function comecaPerguntas(){try{speechSynthesis.cancel()}catch(e){};QI=0;ERROS=0;proxima(true)}
function rPergunta(q,qd){
  OUVIR=function(){fala("Pergunta. ... "+q[0]+" ... Opção A. "+q[1][0]+". ... Opção B. "+q[1][1]+". ... Opção C. "+q[1][2]+".")};
  var h=HI[FI];
  qd.innerHTML='<div class="ord">📖 '+h.t+' — pergunta '+(QI+1)+' de '+Q.length+'</div><div class="frase-txt" style="text-align:left">'+q[0]+'</div><div class="opcoes" style="grid-template-columns:1fr" id="ops"></div><div class="acoes"><button class="btn cz" onclick="mostraHistoria()">📖 Reler a história</button></div>';
  q[1].forEach(function(t,i){var d=document.createElement("div");d.className="op texto";d.textContent=t;
    d.onclick=function(){if(TRAVA)return;if(i===q[2]){d.classList.add("certo");acerta("")}else erra(d)};$("ops").appendChild(d)});
}

/* ===== Fim da fase ===== */
function fimFase(){clearTimeout(AUTO);
  var est=Math.max(1,5-ERROS);
  var antes=figurinhas();
  var k=chave(A,FI);if(!PROG[k]||est>PROG[k]){PROG[k]=est;salva()}
  try{if(window.EduReport&&EduReport.enviar)EduReport.enviar({atividade:"Diversificadas: "+A.n+" fase "+(FI+1),nota:est+"/5"})}catch(e){}
  $("x-tit").textContent=est===5?"Perfeito! 🌟":est>=3?"Muito bem! 👏":"Bom esforço! 💪";
  $("x-est").innerHTML=estrelas(est);
  $("x-txt").textContent=est+" de 5 estrelas — "+ERROS+(ERROS===1?" erro":" erros")+".";
  var dep=figurinhas(),px=$("x-premio");px.innerHTML="";
  if(est===5){moeda(50);px.innerHTML='<div class="premio">🏆 <b>Fase perfeita! +50 moedas</b></div>'}
  if(dep>antes){var nw=W[dep-1];px.innerHTML+='<div class="premio"><b>🎁 Novo prêmio!</b><br><img src="img32/'+nw.i+'.png" alt=""><br><b>Figurinha: '+nw.p.toUpperCase()+'</b></div>'}
  var ac=$("x-acoes");ac.innerHTML="";
  var b=function(t,c,fn){var e=document.createElement("button");e.className="btn "+c;e.textContent=t;e.onclick=fn;ac.appendChild(e)};
  if(FI+1<A.f.length)b("Próxima fase ➡","vd",function(){inicia(FI+1)});
  b("🔁 Repetir","az",function(){inicia(FI)});
  b("📋 Fases","cz",function(){abreFases(ATV.indexOf(A))});
  tela("t-fim");fanfarra();confete();chuvaMoedas(est===5?40:est*6);setTimeout(function(){fala(est>=4?"Parabéns!":"Muito bem!")},500);
}
function confete(){var e=["⭐","🎉","✨","🌟","🎈"];for(var i=0;i<26;i++){(function(i){setTimeout(function(){var s=document.createElement("span");s.className="confete";s.textContent=e[i%5];s.style.left=Math.random()*100+"vw";document.body.appendChild(s);setTimeout(function(){s.remove()},2600)},i*70)})(i)}}
irMenu();
</script>
