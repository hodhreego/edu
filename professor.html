<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel do Professor - Ludopédia</title>
<script>try{var _t=localStorage.getItem('edu_prof_tema');if(!_t&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)_t='dark';if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#111a33;--muted:#5f6b85;--line:#e3e8f2;--soft:#f5f7fc;--brand:#3355e8;--brand2:#7c3aed;--az:#2563eb;--vd:#16a34a;--vm:#dc2626;--am:#d97706;--sh:0 1px 2px rgba(17,26,51,.05),0 4px 14px rgba(17,26,51,.06);--bn:0px;--sbw:244px}
html[data-theme=dark]{--bg:#0b1020;--card:#121a30;--ink:#e7ecfa;--muted:#97a3c2;--line:#243050;--soft:#18223d;--brand:#7090ff;--brand2:#a78bfa;--az:#60a5fa;--vd:#34d399;--vm:#f87171;--am:#fbbf24;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.demo{padding-top:34px;--bn:34px}
#demoBn{display:none;position:fixed;top:0;left:0;right:0;height:34px;z-index:100;background:repeating-linear-gradient(135deg,#f59e0b 0 14px,#dc2626 14px 28px);color:#fff;font:800 13px/34px Arial;text-align:center;letter-spacing:.4px;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden}
body.demo #demoBn{display:block}
h1,h2,h3{letter-spacing:-.2px}h2{margin:0 0 12px;font-size:20px}h3{margin:20px 0 10px;font-size:16px}
.sub{color:var(--muted);margin:0 0 10px;font-size:13.5px}small{color:var(--muted)}
.svg,.i{flex:none;vertical-align:-3px}
button{font:700 14px "Segoe UI",system-ui,Arial,sans-serif;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);cursor:pointer;padding:8px 14px;margin:0 6px 6px 0;transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--brand)}button:active{transform:scale(.97)}
button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}
button.ok{background:var(--vd);color:#fff;border-color:var(--vd)}button.warn{color:var(--vm);border-color:var(--vm)}button.perigo{background:var(--vm);color:#fff;border-color:var(--vm)}
button:disabled{opacity:.6;cursor:wait}
.pill{padding:5px 12px;border-radius:99px;font-size:13px}
.btn.sm{padding:5px 10px;font-size:12.5px;margin:0 0 0 6px;border-radius:9px}
.ib{margin:0;padding:8px;border-radius:10px;color:var(--muted)}.ib:hover{color:var(--ink)}
.lnk{background:none;border:0;color:var(--brand);padding:4px 0;margin:6px 0 0}
.sp{flex:1}
/* ---------- login ---------- */
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:18px;background:radial-gradient(900px 500px at 15% 10%,rgba(124,58,237,.25),transparent),radial-gradient(800px 500px at 90% 90%,rgba(51,85,232,.28),transparent),var(--bg)}
#login .lc{width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 26px;text-align:center;box-shadow:0 20px 50px rgba(17,26,51,.2)}
#login h2{margin:0 0 4px;font-size:22px}
#login input{font:600 18px Arial;padding:13px 14px;width:100%;border:2px solid var(--line);border-radius:12px;margin:12px 0;background:var(--soft);color:var(--ink);text-align:center;letter-spacing:2px}
#login input:focus{outline:none;border-color:var(--brand)}
#login button{width:100%;margin:0;padding:14px;font-size:17px;justify-content:center}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 4px 12px rgba(51,85,232,.35)}
#login .logo{width:64px;height:64px;margin:0 auto 12px;border-radius:18px}
/* ---------- casca: menu lateral + cabeçalho ---------- */
#sb{position:fixed;top:var(--bn);left:0;bottom:0;width:var(--sbw);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:60;transition:transform .25s ease}
.sbh{display:flex;gap:11px;align-items:center;padding:16px 16px 10px}.sbh b{display:block;font-size:16px;line-height:1.1}.sbh small{font-size:12px}
#sbn{flex:1;overflow:auto;padding:4px 10px 10px}
.sbg{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:14px 12px 6px;font-weight:800;opacity:.8}
.nv{display:flex;align-items:center;gap:11px;width:100%;margin:0 0 2px;padding:9px 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:650;font-size:14px;text-align:left;text-decoration:none;position:relative}
.nv:hover{background:var(--soft);color:var(--ink)}
.nv.on{background:linear-gradient(135deg,rgba(51,85,232,.13),rgba(124,58,237,.09));color:var(--brand)}
.nv.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--brand)}
.nv .bd{margin-left:auto;background:var(--vm);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:800}
.sbf{border-top:1px solid var(--line);padding:8px 10px 12px}.nv.sair{color:var(--vm)}
#sbk{display:none;position:fixed;inset:0;background:rgba(5,10,25,.45);z-index:55}
#main{margin-left:var(--sbw);min-height:100vh}
#hd{position:sticky;top:var(--bn);z-index:50;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;padding:10px 22px}
#hb{display:none}
.gs{position:relative;flex:1;max-width:560px}
.gs input{width:100%;padding:9px 40px 9px 38px;border:1.5px solid var(--line);border-radius:11px;background:var(--soft);color:var(--ink);font:500 14px "Segoe UI",system-ui,Arial}
.gs input:focus{outline:none;border-color:var(--brand);background:var(--card)}
.gs>.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gs kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:700 11px Arial;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
#gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.2);max-height:65vh;overflow:auto;display:none;z-index:70;padding:6px}
#gres.on{display:block}
.gh{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:800;color:var(--muted);padding:8px 10px 4px}
.gi{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:9px;cursor:pointer}.gi:hover,.gi.sel{background:var(--soft)}
.gi .t{min-width:0}.gi .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gi .t small{font-size:12px}
.gi0{padding:14px;color:var(--muted);text-align:center;font-size:13px}
#fbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:0 22px 10px}
.fl0{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.fchip{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--line);border-radius:99px;padding:2px 3px 2px 11px;font-size:12px;font-weight:700;color:var(--muted);background:var(--card)}
.fchip.on{border-color:var(--brand);color:var(--brand);background:rgba(51,85,232,.08)}
.fchip select{border:0;background:transparent;color:var(--ink);font:700 12.5px "Segoe UI",Arial;padding:4px 4px;border-radius:99px;cursor:pointer;max-width:170px}
.fchip select:focus{outline:2px solid var(--brand)}
html[data-theme=dark] .fchip select option{background:var(--card)}
.fclr{margin:0;padding:4px 10px;font-size:12px;border-radius:99px;color:var(--vm);border-color:transparent;background:none}
#bcw{padding:7px 22px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:36px}
#bcw a{color:var(--brand);cursor:pointer;font-weight:700}#bcw .sep{opacity:.5}#bcw b{color:var(--ink)}
#bcw button{padding:3px 10px;margin:0 8px 0 0;font-size:12px}
.wrapx{max-width:1280px;margin:0 auto;padding:20px 22px 56px}
/* ---------- cabeçalho de página e cartões ---------- */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:25px;margin:0;line-height:1.15}.ph p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.ph .acts{display:flex;gap:6px;flex-wrap:wrap}.ph .acts button{margin:0}
.card,.box{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.box{padding:13px 15px;margin-bottom:14px}
.cd{padding:16px 18px;margin-bottom:16px;min-width:0}
.ch{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap}
.ch .cic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(51,85,232,.1);color:var(--brand);flex:none}
.ch .cic.r{background:rgba(220,38,38,.1);color:var(--vm)}.ch .cic.g{background:rgba(22,163,74,.12);color:var(--vd)}.ch .cic.y{background:rgba(217,119,6,.13);color:var(--am)}
.ch b{display:block;font-size:15.5px;line-height:1.2}.ch small{display:block;font-size:12.5px;font-weight:500}
.ch button{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.two.w{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sc{margin:0;text-align:left;padding:16px;border-radius:16px;display:block;width:100%;border:1.5px solid var(--line);background:var(--card);box-shadow:var(--sh)}
.sc:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(51,85,232,.16)}
.sc .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));margin-bottom:10px}
.sc .nm{font-size:16px;font-weight:800}.sc .st{font-size:13px;color:var(--muted);font-weight:600;margin:3px 0 9px}
.mb{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.mb i{display:block;height:100%;border-radius:5px;background:var(--brand);animation:grow .9s ease both}
.mb i.az,.fl.az{background:linear-gradient(90deg,#3b82f6,var(--az))}.mb i.vd,.fl.vd{background:linear-gradient(90deg,#4ade80,var(--vd))}.mb i.vm,.fl.vm{background:linear-gradient(90deg,#fb923c,var(--vm))}.mb i.cz{background:#9aa5be}
.al{display:block;text-align:left;margin:0;padding:13px;width:100%;border-radius:16px}
.al:hover{transform:translateY(-2px)}
.al .top{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.al .r{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 14px "Segoe UI",Arial;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.3);letter-spacing:.3px}
.av.sm{width:32px;height:32px;font-size:12px}
.av.big{width:76px;height:76px;font-size:25px;border:3px solid rgba(255,255,255,.75)}
.who{min-width:0;display:block}.who b{display:block;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}.who .wt{font-size:12.5px;color:var(--muted);font-weight:600}.who small{display:block;font-size:11px;opacity:.85;font-family:Consolas,monospace}
.whoc{display:flex;gap:10px;align-items:center;min-width:0}
.nota{display:inline-block;min-width:38px;text-align:center;border-radius:99px;padding:3px 10px;font-weight:800;font-size:13.5px;color:#fff}
.nota.az{background:var(--az)}.nota.vd{background:var(--vd)}.nota.vm{background:var(--vm)}.nota.cz{background:#9aa5be}
.chip{display:inline-flex;gap:4px;align-items:center;background:rgba(51,85,232,.11);color:var(--brand);border-radius:99px;padding:2px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.chip.r{background:rgba(220,38,38,.12);color:var(--vm)}.chip.g{background:rgba(22,163,74,.13);color:var(--vd)}.chip.y{background:rgba(217,119,6,.15);color:#b45309}.chip.b{background:rgba(37,99,235,.13);color:var(--az)}.chip.n{background:var(--soft);color:var(--muted)}
html[data-theme=dark] .chip.y{color:var(--am)}
/* tabelas */
.wrap,.wrap0{overflow:auto}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;box-shadow:var(--sh)}
.tcard{margin-bottom:16px;overflow:hidden}
.tbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tbar b{font-size:15px}.tbar small{font-size:12px}
.tcard .wrap0{max-height:640px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
th{background:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);position:sticky;top:0;z-index:1;white-space:nowrap}
th.so{cursor:pointer;user-select:none}th.so:hover{color:var(--ink)}th .ar{opacity:.35;margin-left:3px}th.act .ar{opacity:1;color:var(--brand)}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--soft)}tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.reltab td:first-child,.reltab th:first-child{position:sticky;left:0;background:var(--card);z-index:1}.reltab th:first-child{background:var(--soft);z-index:2}
.kv{display:flex;flex-wrap:wrap;gap:8px}.kv>div{background:var(--soft);border-radius:12px;padding:9px 13px;font-size:13px;color:var(--muted);min-width:110px}.kv b{display:block;font-size:20px;color:var(--ink)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:15px 16px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;animation:up .5s ease both;animation-delay:calc(var(--i,0)*60ms)}
.kpi .kic{position:absolute;right:13px;top:13px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--kc,var(--brand));background:color-mix(in srgb,var(--kc,var(--brand)) 13%,transparent)}
.kpi .kl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding-right:46px}
.kpi .kv2{font-size:clamp(22px,2.8vw,29px);overflow-wrap:anywhere;font-weight:850;line-height:1.1;margin-top:3px;font-variant-numeric:tabular-nums}.kpi .kd{font-size:12px;font-weight:650;color:var(--muted)}
.kpi::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--kc,var(--brand));opacity:.85}
.dl{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:800;font-size:11px;margin-right:4px}.dl.up{background:rgba(22,163,74,.15);color:var(--vd)}.dl.dn{background:rgba(220,38,38,.14);color:var(--vm)}.dl.eq{background:var(--soft)}
.aviso{background:rgba(217,119,6,.11);border:1.5px solid color-mix(in srgb,var(--am) 60%,transparent);border-radius:12px;padding:9px 13px;margin:8px 0;font-size:13px}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:9px 13px;margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.msg{padding:9px 13px;border-radius:12px;margin:8px 0;font-weight:700;font-size:14px}.msg.ok{background:rgba(22,163,74,.13);color:var(--vd)}.msg.er{background:rgba(220,38,38,.12);color:var(--vm)}
.load{color:var(--muted);padding:26px;text-align:center}.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-3px;margin-right:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin:4px 0}.row>.t{font-weight:800;font-size:11.5px;color:var(--muted);margin:0 8px 6px 0;text-transform:uppercase;letter-spacing:.4px}
.inp{font:600 15px "Segoe UI",Arial;padding:8px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}.inp:focus{outline:none;border-color:var(--brand)}
/* esqueleto e vazio */
.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);background-size:200% 100%;animation:shim 1.3s linear infinite;border-radius:14px;border:0;box-shadow:none}
.sk-h{height:34px;width:300px;max-width:70%;margin-bottom:18px}.sk-k{height:112px}.sk-b{height:280px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 14px;text-align:center;color:var(--muted)}
.empty .ei{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--brand);margin-bottom:4px}
.empty b{color:var(--ink);font-size:15px}.empty span{font-size:13px;max-width:380px}
/* barras horizontais */
.br{display:grid;grid-template-columns:minmax(120px,30%) 1fr minmax(70px,auto);gap:10px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
.br:last-child{border-bottom:0}.br:hover{background:var(--soft)}.br .lb{font-size:13px;font-weight:700;overflow-wrap:anywhere}.br .lb small{display:block;font-weight:600;font-size:11px}
.br .tr{background:var(--line);border-radius:8px;height:20px;position:relative;overflow:hidden}.br .fl{height:100%;border-radius:8px;background:linear-gradient(90deg,#818cf8,var(--brand));min-width:3px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.br .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.br .vl{font-size:13px;font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-top:4px;background:var(--line)}.seg i{display:block;height:100%}
.seg.big{height:22px;border-radius:8px;margin:0}.seg.big i{cursor:pointer;transition:filter .12s;display:grid;place-items:center;color:#fff;font:800 11px Arial;overflow:hidden}.seg.big i:hover{filter:brightness(1.12)}
/* rosca e ranking */
.dnw{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.dn{width:190px;height:190px;position:relative}.dn svg{width:100%;height:100%;transform:rotate(-90deg)}
.dn circle{fill:none;stroke-width:22;cursor:pointer;transition:stroke-width .15s;animation:dnin 1.1s cubic-bezier(.2,.8,.2,1) both}.dn circle:hover{stroke-width:28}
.dn .ct{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}.dn .ct b{font-size:28px;line-height:1}.dn .ct small{font-size:11px}
.lg{display:grid;gap:6px;min-width:160px}.lg button{margin:0;text-align:left;padding:7px 11px;font-size:13px}
.lg i{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.rk{display:grid;grid-template-columns:34px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:12px;cursor:pointer;animation:up .45s ease both;animation-delay:calc(var(--i,0)*35ms)}
.rk:hover{background:var(--soft)}.rk .md{text-align:center;font-weight:800;color:var(--muted);font-size:14px;display:grid;place-items:center}
.rk .vv{font-weight:850;font-size:14px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
/* pódio */
.podw{position:relative;max-width:660px;margin:0 auto}
.pod{width:100%;height:auto;display:block;overflow:visible}
.pod .blk{transform-box:fill-box;transform-origin:50% 100%;animation:rise .95s cubic-bezier(.2,.9,.25,1.12) both}
.pod .wh{animation:drop .75s cubic-bezier(.2,.9,.3,1.3) both}
.pod .shn{animation:shn 2.6s ease-in-out infinite}
.pod .sw{animation:sw 4.2s ease-in-out 1.4s infinite}
.pod g[data-a]{cursor:pointer}.pod g[data-a]:hover .wh{filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.pod text{font-family:"Segoe UI",system-ui,Arial,sans-serif}
.pod .t1{fill:#fff;font-weight:800}.pod .t2{fill:#c7d2fe;font-weight:600}.pod .tx{fill:var(--muted);font-weight:700}
