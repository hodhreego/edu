<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR de login do RobIox</title>
<script src="qrcode.min.js"></script>
<script src="alunos-rco.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef1f7;color:#111}
.pn{position:sticky;top:0;z-index:5;background:#1b2a5a;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pn label{font-size:13px;display:flex;flex-direction:column;gap:2px}.pn select,.pn input,.pn textarea,.pn button{font:inherit;padding:6px 8px;border-radius:8px;border:0}
.pn button{background:#16a34a;color:#fff;font-weight:800;cursor:pointer}.pn button.b2{background:#e5e7eb;color:#111}
.ro{display:none;background:#fff;padding:10px 14px}.ro.on{display:block}.ro textarea{width:100%;height:140px;border:1px solid #bbb}
.pg{width:210mm;margin:8px auto;background:#fff;padding:7mm;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto repeat(6,44mm);gap:2mm;page-break-after:always;break-after:page}
.cd{border:1.5px dashed #888;border-radius:2.5mm;padding:1.6mm;text-align:center;height:44mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden}
.cd>*{flex:none}.cd .t{font:400 6.5pt Arial,sans-serif;line-height:1.15;height:2.3em;overflow:hidden;width:100%}.cd .t.vz{color:#999;font-weight:700}
.cd .q{width:20mm;height:20mm}.cd .q img,.cd .q canvas{width:20mm!important;height:20mm!important}.cd .k{font:700 6pt Arial,sans-serif;color:#0033ff;line-height:1.1;word-break:break-all}
.cd .l{font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:12pt;letter-spacing:.3px;-webkit-text-stroke:.35px #000;color:#000}.cd .n{font:700 8pt Arial,sans-serif;color:#555}
.ti{grid-column:1/-1;font:800 11pt Arial,sans-serif;display:flex;justify-content:space-between;border-bottom:2px solid #1b2a5a;padding-bottom:1mm}
@media print{body{background:#fff}.pn,.ro{display:none!important}.pg{margin:0;width:auto;padding:6mm}@page{size:A4;margin:0}}
.cd .pw{font:700 7pt Arial,sans-serif;color:#e00000;line-height:1.1}.cd .pw b{font-size:8pt;color:#e00000}
.cd .up{font:700 6pt Arial,sans-serif;color:#111;line-height:1}
.cd .q{width:19mm!important;height:19mm!important}.cd .q img,.cd .q canvas{width:19mm!important;height:19mm!important}
.cd{position:relative;padding-right:5mm!important}.cd .pw{position:absolute;right:1mm;top:0;bottom:0;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font:700 7pt Arial,sans-serif;color:#e00000;white-space:nowrap}.cd .pw b{font-size:9pt;color:#e00000;letter-spacing:.3px}.cd .q{width:var(--qr)!important;height:var(--qr)!important}.cd .q img,.cd .q canvas{width:22mm!important;height:22mm!important}
</style><style id="ajcss">
:root{--qr:29mm;--fl:12pt;--fn:6.5pt;--fp:9pt;--fk:6pt;--fnl:8pt;--mg:7mm;--ch:44mm;--gp:0mm}
.cd .q,.cd .q img,.cd .q canvas{width:var(--qr)!important;height:var(--qr)!important}
.cd .l{font-size:var(--fl)!important}.cd .t{font-size:var(--fn)!important}
.cd .pw b{font-size:var(--fp)!important}.cd .pw{font-size:calc(var(--fp)*.78)!important}
.cd .k{font-size:var(--fk)!important}.cd .k b{font-size:calc(var(--fk)*1.3)!important}.cd .n{font-size:var(--fnl)!important}
.pg{padding:var(--mg)!important;grid-template-rows:auto repeat(6,var(--ch))!important;gap:var(--gp)!important}.cd{height:var(--ch)!important}
#ajb{position:fixed;right:14px;bottom:14px;z-index:50;width:46px;height:46px;border-radius:50%;border:0;background:#1b2a5a;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 14px #0006}
#ajp{display:none;position:fixed;right:14px;bottom:68px;z-index:50;width:min(92vw,300px);max-height:78vh;overflow:auto;background:#fff;border:2px solid #1b2a5a;border-radius:14px;padding:10px 12px;box-shadow:0 8px 30px #0005;font:13px Arial,sans-serif}
#ajp.on{display:block}#ajp h3{margin:0 0 6px;font-size:14px}#ajp label{display:block;margin:7px 0 0}#ajp label span{float:right;font-weight:700;color:#16a34a}#ajp input[type=range]{width:100%}
#ajp button{width:100%;margin-top:8px;padding:8px;border:0;border-radius:9px;background:#16a34a;color:#fff;font-weight:800;cursor:pointer}#ajp button.b2{background:#e5e7eb;color:#111}
@media print{#ajb,#ajp{display:none!important}}
.cd{border:0!important;border-radius:0!important;border-right:1.5px dotted #555!important;border-bottom:1.5px dotted #555!important}.cd:nth-child(-n+6){border-top:1.5px dotted #555!important}.cd:nth-child(5n+2){border-left:1.5px dotted #555!important}
.cd{padding-left:6.5mm!important}.cd .t{position:absolute!important;left:.8mm;top:0;bottom:0;width:auto!important;height:auto!important;min-height:0!important;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;line-height:1.1}
.cd{padding-left:5mm!important;padding-right:5mm!important}.cd .t{left:.5mm!important}.cd .pw{right:.5mm!important}.cd .q{margin-left:auto;margin-right:auto}
.cd .t.vz{top:2.5mm!important;bottom:2.5mm!important;width:4.4mm!important;left:.8mm!important;border:.3mm solid #666;background:linear-gradient(#aaa .25mm,transparent .25mm) 0 0/2.2mm 2.2mm,linear-gradient(90deg,#aaa .25mm,transparent .25mm) 0 0/2.2mm 2.2mm;color:transparent}
</style></head><body>
<div class="pn">
<label>Turma<select id="tu"></select></label>
<label>Escola (3 letras)<input id="es" size="4" maxlength="3" placeholder="cla"></label>
<label>Turma (série+letra)<input id="sr" size="4" maxlength="2" placeholder="6b"></label>
<label>Link curto do RobIox<input id="lk" size="22" placeholder="ex.: bit.ly/robiox"></label>
<label>Até o nº<input id="mx" type="number" value="60" min="1" max="99" style="width:70px"></label>
<button id="go">Gerar QR</button><button class="b2" id="rs">Colar lista de alunos</button><button class="b2" id="al">Gerar TODAS as turmas</button><button id="pr">🖨️ Imprimir</button>
</div>
<div class="ro" id="ro"><b>Cole a lista da turma</b> (uma linha por aluno: <code>número nome</code>, ex.: <code>7 Maria da Silva</code>). Números sem aluno ficam como "alu".<textarea id="ta"></textarea><button id="ok" style="background:#16a34a;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:800">Usar esta lista</button></div>
<div id="out"></div>
<script>
var $=function(i){return document.getElementById(i)},R=window.RCO_ALUNOS||{},BASE=location.origin+location.pathname.replace(/[^/]*$/,'')+'robiox.html?l=';
var tu=$('tu');tu.innerHTML='<option value="">Todas as turmas</option>'+Object.keys(R).map(function(k){return '<option value="'+k+'">'+k+'</option>'}).join('');
tu.onchange=function(){var k=tu.value;if(!k){$('al').click();return}var m=k.match(/^([a-z]{3})(\d[a-z])$/);if(m){$('es').value=m[1];$('sr').value=m[2]}};
$('rs').onclick=function(){$('ro').classList.toggle('on')};
var MAN={};function LK(){return ($('lk').value||'').trim().replace(/^https?:\/\//,'')}$('lk').value='bit.ly/xus26';try{var _l=localStorage.getItem('qr_lk2');if(_l)$('lk').value=_l}catch(e){}$('lk').oninput=function(){try{localStorage.setItem('qr_lk2',$('lk').value)}catch(e){}};
$('ok').onclick=function(){MAN={};$('ta').value.split(/\n/).forEach(function(l){var m=l.trim().match(/^(\d{1,2})\s*[-.;:\t ]\s*(.+)$/);if(m)MAN[+m[1]]=m[2].trim()});$('ro').classList.remove('on');gera()};
function nomeAbrev(n){return String(n||'').trim().split(/\s+/).map(function(w,i,a){return (i&&['da','de','do','das','dos','e'].indexOf(w.toLowerCase())>=0)?w.toLowerCase():w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()}).join(' ')}
function cards(esc,tur,max,nomes,out){
 var tot=Math.ceil(max/30),n=1;
 for(var p=0;p<tot;p++){var pg=document.createElement('div');pg.className='pg';
  pg.innerHTML='<div class="ti"><span>RobIox · turma '+tur.toUpperCase()+' · '+esc.toUpperCase()+'</span><span>pág. '+(p+1)+'/'+tot+'</span></div>';
  for(var i=0;i<30&&n<=max;i++,n++){
   var lg=n+esc+tur,c=document.createElement('div');c.className='cd';
   var nm=nomes&&nomes[n];
   c.innerHTML='<div class="l">'+lg+'</div><div class="pw">senha: <b>2026.2026</b></div><div class="q"></div><div class="t'+(nm?'':' vz')+'">'+(nm?nomeAbrev(nm):'')+'</div>'+(LK()?'<div class="k">Digite: <b style="color:#0033ff;font-size:8pt">'+LK()+'</b></div>':'');
   pg.appendChild(c);
   new QRCode(c.querySelector('.q'),{text:'rbx:'+lg,width:240,height:240,correctLevel:QRCode.CorrectLevel.M})}
  out.appendChild(pg)}}
function gera(){var es=$('es').value.trim().toLowerCase(),sr=$('sr').value.trim().toLowerCase(),mx=Math.min(99,+$('mx').value||60);
 if(!es&&!sr&&!$('tu').value&&Object.keys(R).length){$('al').click();return}
 if(!/^[a-z]{3}$/.test(es)||!/^\d[a-z]$/.test(sr)){alert('Informe a escola (3 letras, ex.: cla) e a turma (ex.: 6b).');return}
 var nomes=Object.keys(MAN).length?MAN:(R[es+sr]||{});$('out').innerHTML='';cards(es,sr,Math.max(mx,Math.max.apply(null,[0].concat(Object.keys(nomes).map(Number)))),nomes,$('out'))}
$('go').onclick=gera;
$('al').onclick=function(){var ks=Object.keys(R);if(!ks.length){alert('Ainda não há lista de alunos carregada.');return}$('out').innerHTML='';var mx=Math.min(99,+$('mx').value||60);ks.forEach(function(k){var m=k.match(/^([a-z]{3})(\d[a-z])$/);if(m)cards(m[1],m[2],Math.max(mx,Math.max.apply(null,Object.keys(R[k]).map(Number))),R[k],$('out'))})};
$('pr').onclick=function(){window.print()};
</script><button id="ajb" type="button" title="Ajustes">⚙</button>
<div id="ajp"><h3>⚙ Ajustes dos cartões</h3><div id="ajs"></div><button type="button" id="ajr" class="b2">Restaurar padrão</button><button type="button" id="ajpr">🖨️ Imprimir</button></div>
<script>
(function(){var D=[['--qr','Tamanho do QR',14,32,.5,'mm',29],['--fl','Login (topo)',9,16,.5,'pt',12],['--fn','Nome do aluno (lateral)',5,9,.25,'pt',6],['--fp','Senha (lateral)',6,12,.5,'pt',9],['--fk','Link curto',5,9,.25,'pt',6],['--fnl','Linha "nº · login"',6,10,.25,'pt',8],['--mg','Margem da folha',2,15,.5,'mm',7],['--ch','Altura do cartão',38,47,.5,'mm',44],['--gp','Espaço entre cartões',0,6,.5,'mm',0]],R=document.documentElement,K='qr_aj',S={};
try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
function ap(v,x){R.style.setProperty(v,x)}
var box=document.getElementById('ajs');
D.forEach(function(d){var val=S[d[0]]!=null?S[d[0]]:d[6],l=document.createElement('label');l.innerHTML=d[1]+'<span>'+val+d[5]+'</span><input type="range" min="'+d[2]+'" max="'+d[3]+'" step="'+d[4]+'" value="'+val+'">';
 var inp=l.querySelector('input'),sp=l.querySelector('span');ap(d[0],val+d[5]);
 inp.oninput=function(){sp.textContent=inp.value+d[5];ap(d[0],inp.value+d[5]);S[d[0]]=+inp.value;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};box.appendChild(l)});
document.getElementById('ajb').onclick=function(){document.getElementById('ajp').classList.toggle('on')};
document.getElementById('ajr').onclick=function(){S={};try{localStorage.removeItem(K)}catch(e){}D.forEach(function(d,i){ap(d[0],d[6]+d[5]);var l=box.children[i];l.querySelector('input').value=d[6];l.querySelector('span').textContent=d[6]+d[5]})};
document.getElementById('ajpr').onclick=function(){window.print()};
})();
</script>
</body></html>
