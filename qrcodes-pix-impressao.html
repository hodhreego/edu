<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Codes do Pix - Folha de impressão</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#eef1f7;color:#111}#bar{position:sticky;top:0;background:#16213a;color:#fff;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}#bar button{border:0;border-radius:99px;padding:8px 16px;font:800 14px Arial;background:#ffd24d;color:#16213a;cursor:pointer}
.pg{width:190mm;margin:10px auto;background:#fff;padding:8mm;box-sizing:border-box}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}.q{border:2px dashed #888;border-radius:6px;padding:4mm;text-align:center;break-inside:avoid}.q svg{width:100%;height:auto;display:block}.n{font:900 26px Arial;margin-top:2mm}.t{font-size:12px;min-height:30px}
h1{font-size:20px;margin:0 0 4mm}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid #888;padding:4px 8px;text-align:left}.pb{break-before:page}
@media print{#bar{display:none}body{background:#fff}.pg{margin:0;width:auto;padding:0}@page{size:A4;margin:10mm}.pb{break-before:page}}</style></head><body>
<div id="bar"><b>🖨️ QR Codes do Pix (câmera)</b><label><input type="checkbox" id="ck"> mostrar nome e valor impressos</label><button onclick="print()">Imprimir / Salvar PDF</button><a style="color:#fff" href="pix-qrcode-camera-jogo.html">▶ Abrir o jogo</a></div>
<div class="pg"><h1>QR Codes de Pix — recorte e distribua</h1><div class="g" id="g"></div></div>
<div class="pg pb"><h1>Gabarito do professor</h1><table id="gab"><tr><th>QR</th><th>Quem recebe</th><th>Valor</th></tr></table></div>
<script src="qrgen.js"></script><script src="qrcatalogo.js"></script><script src="config.js"></script><script src="imprimir.js"></script>
<script>
function fmt(c){return 'R$ '+Math.floor(c/100).toLocaleString('pt-BR')+','+String(c%100).padStart(2,'0')}
var g=document.getElementById('g'),gb=document.getElementById('gab');
QRCAT.forEach(function(it){var q=qrcode(0,'M');q.addData(QRPAY(it));q.make();
 g.insertAdjacentHTML('beforeend','<div class="q">'+q.createSvgTag({cellSize:6,margin:2,scalable:true})+'<div class="n">QR '+it.id+'</div><div class="t"><span class="inf" style="display:none">'+it.nome+'<br><b>'+fmt(it.valor)+'</b></span></div></div>');
 gb.insertAdjacentHTML('beforeend','<tr><td>'+it.id+'</td><td>'+it.nome+'</td><td>'+fmt(it.valor)+'</td></tr>')});
document.getElementById('ck').onchange=function(e){document.querySelectorAll('.inf').forEach(function(x){x.style.display=e.target.checked?'':'none'})};
if(!EDU_PROF_OK()){document.body.style.visibility='hidden';EDU_PROF_ASK(function(ok){if(ok)location.reload();else location.href='index.html'})}
</script></body></html>
